// flow geometry in the 1000x720 design box: auto-place nodes, trim edges to the node boxes.
function flowLayout(s) {
  const n = s.nodes.length, top = s.title ? 250 : 120;
  s.nodes.forEach((nd, k) => {
    if (nd.x === undefined) nd.x = n <= 3 ? Math.round(1000 * (k + 1) / (n + 1)) : (k % 2 ? 720 : 280);
    if (nd.y === undefined) nd.y = n <= 3 ? top + 200 : top + 40 + k * Math.min(150, (680 - top) / Math.max(1, n - 1));
    nd._w = 60 + String(nd.text || '').length * 19.5 + (nd.b ? 78 : 0); nd._h = nd.sub ? 108 : 86;
  });
  (s.edges || []).forEach((e) => {
    const a = s.nodes[e.from], b = s.nodes[e.to], dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const trim = (nd) => Math.min(Math.abs(ux) > 1e-6 ? nd._w / 2 / Math.abs(ux) : 1e9, Math.abs(uy) > 1e-6 ? nd._h / 2 / Math.abs(uy) : 1e9) + 12;
    const ta = trim(a), tb = trim(b) + 8;
    e._x1 = Math.round(a.x + ux * ta); e._y1 = Math.round(a.y + uy * ta); e._x2 = Math.round(b.x - ux * tb); e._y2 = Math.round(b.y - uy * tb);
    e._len = Math.max(1, Math.round(Math.hypot(e._x2 - e._x1, e._y2 - e._y1))); e._ang = Math.round(Math.atan2(uy, ux) * 57.2958);
  });
}

// Scene transitions (scene.tr, or data.tr for every scene): push (default, slide-push), up (vertical push), zoom (scale-through),
// morph (shared element: the outgoing card flies into the incoming card's box), fade, cut (legacy blur-in hard cut).
const TR_D = 0.36;
function layersOf(i) { return ['s', 'sb', 'sp', 'px'].map((p) => document.getElementById(p + i)).filter(Boolean); }
function transition(tl, data, i) {
  const s = data.scenes[i], prev = data.scenes[i - 1], tr = s.tr || data.tr || 'push';
  const el = document.getElementById('s' + i), inner = el.firstElementChild, t = s.t;
  if (!prev || tr === 'cut') {
    tl.fromTo(inner, { scale: 0.92, opacity: 0, filter: 'blur(12px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.3, ease: 'back.out(1.4)', immediateRender: false }, t);
    window.sfx.push({ t, kind: 'tick' });
    return 0;
  }
  const pin = layersOf(i), pout = layersOf(i - 1), pel = document.getElementById('s' + (i - 1)), pinner = pel.firstElementChild;
  window.smoothWin.push([t - 0.02, t + TR_D + 0.08]);
  window.sfx.push({ t, kind: 'whoosh', vol: 0.14 });
  if (tr === 'push' || tr === 'up') {
    const k = tr === 'up' ? 'y' : 'x', D = tr === 'up' ? 1100 : 1080;
    tl.fromTo(pin, { [k]: D }, { [k]: 0, duration: TR_D, ease: 'power3.inOut', immediateRender: false }, t)
      .fromTo(pout, { [k]: 0 }, { [k]: -D, duration: TR_D, ease: 'power3.inOut', immediateRender: false }, t)
      .set(pout, { [k]: 0 }, t + TR_D + 0.06);
  } else if (tr === 'zoom') {
    tl.fromTo(pinner, { scale: 1, opacity: 1 }, { scale: 1.7, opacity: 0, duration: TR_D * 0.8, ease: 'power2.in', immediateRender: false }, t)
      .fromTo(inner, { scale: 0.45, opacity: 0 }, { scale: 1, opacity: 1, duration: TR_D, ease: 'power3.out', immediateRender: false }, t + 0.1)
      .set(pinner, { scale: 1, opacity: 1 }, t + TR_D + 0.12);
  } else if (tr === 'fade') {
    tl.fromTo(pinner, { opacity: 1 }, { opacity: 0, duration: TR_D, immediateRender: false }, t).fromTo(inner, { opacity: 0 }, { opacity: 1, duration: TR_D, immediateRender: false }, t).set(pinner, { opacity: 1 }, t + TR_D + 0.06);
  } else if (tr === 'morph') {
    const r1 = pinner.getBoundingClientRect(), r2 = inner.getBoundingClientRect();
    const z1 = r1.width / Math.max(1, pinner.offsetWidth) || 1, z2 = r2.width / Math.max(1, inner.offsetWidth) || 1;
    const c1 = [r1.left + r1.width / 2, r1.top + r1.height / 2], c2 = [r2.left + r2.width / 2, r2.top + r2.height / 2];
    const sx = r2.width / Math.max(1, r1.width), sy = r2.height / Math.max(1, r1.height);
    tl.fromTo(pinner, { x: 0, y: 0, scaleX: 1, scaleY: 1, opacity: 1 }, { x: (c2[0] - c1[0]) / z1, y: (c2[1] - c1[1]) / z1, scaleX: sx, scaleY: sy, opacity: 0, duration: TR_D + 0.08, ease: 'power3.inOut', immediateRender: false }, t)
      .fromTo(inner, { x: (c1[0] - c2[0]) / z2, y: (c1[1] - c2[1]) / z2, scaleX: 1 / sx, scaleY: 1 / sy, opacity: 0 }, { x: 0, y: 0, scaleX: 1, scaleY: 1, opacity: 1, duration: TR_D + 0.08, ease: 'power3.inOut', immediateRender: false }, t)
      .set(pinner, { x: 0, y: 0, scaleX: 1, scaleY: 1, opacity: 1 }, t + TR_D + 0.12);
  }
  return TR_D + 0.04;
}

function sceneIn(tl, el, s) {
  tl.set(el, { opacity: 1 }, s.t);
  tl.fromTo(el, { scale: 1 }, { scale: 1.04, duration: Math.max(0.5, s.end - s.t), ease: 'none' }, s.t);
  tl.set(el, { opacity: 0 }, s.out ?? s.end);
  // nothing sits still: a slow drift and tilt on every card
  const dur = Math.max(0.6, (s.out ?? s.end) - s.t), n = Math.max(1, Math.round(dur / 1.6));
  tl.fromTo(el, { yPercent: -0.6, rotation: -0.35 }, { yPercent: 0.6, rotation: 0.35, duration: dur / n, ease: 'sine.inOut', yoyo: true, repeat: n - 1, immediateRender: false }, s.t);
}

    const sv = el.querySelector('.sv');
    if (sv && sv.dataset.n !== '') { const n = Number(sv.dataset.n), txt = sv.textContent, o = { v: 0 }, fmt = (v) => txt.replace(/[\d,.]+/, Math.round(v).toLocaleString('en-US'));

        .fromTo(bf, { skewY: -3 }, { skewY: 3, duration: d / m, ease: 'sine.inOut', yoyo: true, repeat: m - 1, immediateRender: false }, s.t + 0.5); window.sfx.push({ t: s.t + 0.1, kind: 'pop', vol: 0.1 }); }

function sentences(words) {
  const out = []; let cur = [];
  words.forEach((w, i) => { cur.push({ ...w, i }); const txt = cur.map((x) => x.w).join(' ');
    if (/[.?!,;:]$/.test(w.w) || cur.length >= 3 || txt.length > 16) { out.push(cur); cur = []; } });
  if (cur.length) out.push(cur);
  return out;
}

      if (trD && (s.tr || data.tr || 'push') !== 'fade') tl.set('#wipe', { backgroundColor: c, opacity: 1, x: 0, y: 0, [k]: k === 'y' ? 1920 : 1080 }, s.t).to('#wipe', { [k]: 0, duration: TR_D, ease: 'power3.inOut' }, s.t).set('#wipe', { opacity: 0 }, s.t + TR_D + 0.01);

  }

  // Captions: word-by-word build, older words dim, line clears on sentence end.
  lines.forEach((ln, li) => {
    const line = document.getElementById('l' + li), start = ln[0].start - 0.03, end = lines[li + 1] ? lines[li + 1][0].start - 0.05 : Math.min(data.duration, ln.at(-1).end + 0.8);

    ln.forEach((w, k) => {

      tl.fromTo(el, { opacity: 0, filter: 'blur(8px)', y: -8 }, { opacity: 1, filter: 'blur(0px)', y: 0, duration: 0.15, ease: 'power2.out' }, Math.max(0, w.start - 0.03));
      
      if (el.classList.contains('box')) tl.fromTo(el, { '--bx': 0 }, { '--bx': 1, duration: 0.2 }, w.start);
      if (el.classList.contains('strike')) tl.fromTo(el, { '--sx': 0 }, { '--sx': 1, duration: 0.2 }, w.end - 0.05);
    });
    tl.to(line, { opacity: 0, y: -12, filter: 'blur(6px)', duration: 0.18 }, Math.max(start + 0.2, end - 0.18));
  });

  const HS = data.hook?.style || 'blast';
  if (data.hook && HS !== 'blast') {
    const H = data.hook, n = H.targets.length;
    document.querySelector('#hook .gun').style.display = 'none';
    let end = 1.5;
    if (HS === 'slam') {
      H.targets.forEach((b, i) => { const el = document.getElementById('ht' + i), t0 = 0.05 + i * 0.32, y = parseFloat(el.style.top);
        el.style.top = `${720 - (i % 2) * 220}px`; el.style.width = el.style.height = n > 4 ? '170px' : '200px'; el.style.left = `${40 + i * (860 / Math.max(1, n))}px`;
        tl.fromTo(el, { y: -1400, rotation: -20 + i * 13 }, { y: 0, rotation: (i % 2 ? 6 : -6), duration: 0.28, ease: 'power3.in', immediateRender: false }, t0)
          .fromTo('#cv', { y: 0 }, { y: 18, duration: 0.04, yoyo: true, repeat: 3, immediateRender: false }, t0 + 0.28);
        const c = document.getElementById('hc' + i), d = document.getElementById('hd' + i);
        c.style.left = el.style.left; c.style.top = (parseFloat(el.style.top) + 205) + 'px'; d.style.left = (parseFloat(el.style.left) - 80) + 'px'; d.style.top = (parseFloat(el.style.top) + 150) + 'px';
        tl.set(c, { opacity: 1 }, t0 + 0.28).fromTo(d, { opacity: .9, scale: .4 }, { opacity: 0, scale: 1.4, duration: .5, immediateRender: false }, t0 + 0.28);
        window.sfx.push({ t: t0 + 0.28, kind: 'thud' }); });
      end = 0.1 + n * 0.32 + 0.6;
      tl.set(H.targets.map((_, i) => '#ht' + i + ',#hc' + i).join(','), { opacity: 0 }, end);
    } else if (HS === 'breaking') {
      tl.fromTo('#hbar', { opacity: 1, x: -1200 }, { x: 0, duration: 0.2, ease: 'power4.out', immediateRender: false }, 0)
        .fromTo('#htick', { opacity: 1 }, { opacity: 1, duration: 0.01, immediateRender: false }, 0.15)
        .fromTo('#htick b', { x: 0 }, { x: -1800, duration: 2.2, ease: 'none', immediateRender: false }, 0.15);
      H.targets.forEach((b, i) => { const el = document.getElementById('ht' + i); el.style.left = `${440 - (n - 1) * 115 + i * 230}px`; el.style.top = '760px';
        tl.fromTo(el, { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: 'power3.in', immediateRender: false }, 0.3 + i * 0.2); window.sfx.push({ t: 0.3 + i * 0.2 + 0.18, kind: 'pop' }); });

      window.sfx.push({ t: 0.02, kind: 'whoosh' }, { t: 0.2, kind: 'thud' });
      end = 1.9;
      tl.set('#hbar,#htick', { opacity: 0 }, end).set(H.targets.map((_, i) => '#ht' + i).join(','), { opacity: 0 }, end);
    } else if (HS === 'zoom') {
      tl.fromTo('#hshot', { opacity: 1, scale: 0.3, rotation: -8 }, { scale: 1, rotation: 2, duration: 0.35, ease: 'back.out(1.6)', immediateRender: false }, 0)
        .to('#hshot', { scale: 1.12, duration: 1.2, ease: 'none' }, 0.35);
      for (let k = 0; k < 3; k++) tl.set('#hgl', { opacity: .9 }, 0.35 + k * 0.4).set('#hgl', { opacity: 0 }, 0.4 + k * 0.4);
      H.targets.forEach((b, i) => { const el = document.getElementById('ht' + i); el.style.left = (i % 2 ? 760 : 80) + 'px'; el.style.top = (230 + Math.floor(i / 2) * 900) + 'px';
        tl.fromTo(el, { scale: 0, rotation: -30 }, { scale: 0.8, rotation: i % 2 ? 10 : -10, duration: 0.25, ease: 'back.out(2.5)', immediateRender: false }, 0.5 + i * 0.15); window.sfx.push({ t: 0.5 + i * 0.15, kind: 'pop' }); });
      window.sfx.push({ t: 0.0, kind: 'whoosh' });
      end = 1.7;
      tl.set('#hshot', { opacity: 0 }, end).set(H.targets.map((_, i) => '#ht' + i).join(','), { opacity: 0 }, end);
    }
    if (H.text) tl.fromTo('#hko', { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.18, ease: 'power4.in', immediateRender: false }, end - 0.35).to('#hko', { opacity: 0, duration: 0.15 }, end + 0.3);
    tl.set('#hook', { opacity: 0 }, end + 0.45);
    window.hookEnd = end + 0.45;
  }
  if (data.hook && HS === 'blast') {
    const H = data.hook, n = H.targets.length, per = (H.dur ?? 1.6) / (n + 0.6);
    tl.fromTo('#hook .gun', { x: -300 }, { x: 0, duration: 0.18, ease: 'power3.out', immediateRender: false }, 0);
    H.targets.forEach((b, i) => {
      const t0 = 0.15 + i * per, el = document.getElementById('ht' + i), r = el.getBoundingClientRect();
      const tx = parseFloat(el.style.left) + 80, ty = parseFloat(el.style.top) + 90;

        const bolt = document.getElementById('hb' + ((i * 2 + k) % 10));

        tl.fromTo('#hflash', { opacity: 1, scale: 0.6 }, { opacity: 0, scale: 1.3, duration: 0.08, immediateRender: false }, t0 + k * 0.07);
        tl.fromTo('#hook .gun', { x: -14 }, { x: 0, duration: 0.06, immediateRender: false }, t0 + k * 0.07);
        window.sfx.push({ t: t0 + k * 0.07, kind: 'blast' });
      }
      const hit = t0 + 0.2;
      tl.fromTo(el, { filter: 'brightness(1)' }, { filter: 'brightness(3)', duration: 0.05, yoyo: true, repeat: 1, immediateRender: false }, hit).set(el, { opacity: 0 }, hit + 0.12);
      for (let k = 0; k < 6; k++) { const sh = document.getElementById('hs' + (i * 6 + k)), a = (k / 6) * Math.PI * 2;
        tl.fromTo(sh, { opacity: 1, left: tx, top: ty, rotation: 0 }, { left: tx + Math.cos(a) * 260, top: ty + Math.sin(a) * 260 + 160, rotation: 220, opacity: 0, duration: 0.55, ease: 'power2.out', immediateRender: false }, hit + 0.1); }
      window.sfx.push({ t: hit + 0.1, kind: 'thud' });

    tl.to(el, { y: -8, duration: 0.6, yoyo: true, repeat: Math.max(0, Math.floor((k.end - k.t) / 0.6) - 1), ease: 'sine.inOut' }, k.t + 0.3);
    tl.set(el, { opacity: 0 }, k.end);
    window.sfx.push({ t: k.t, kind: 'tick' });

  if (data.branded) { tl.set('#badge', { opacity: 0 }, 0).fromTo('#badge', { opacity: 1, y: 60, scale: 0.6 }, { y: 0, scale: 1, duration: 0.4, ease: 'back.out(1.6)', immediateRender: false }, Math.max(0, data.duration - 3.2)); tl.to('#cv .mark', { rotation: 360, duration: 0.8, ease: 'back.out(1.4)' }, 0.1); }
  if (data.hook && window.hookEnd) { tl.set('#scs', { opacity: 0 }, 0).set('#scs', { opacity: 1 }, window.hookEnd); tl.set('.caps', { opacity: 0 }, 0).set('.caps', { opacity: 1 }, Math.min(window.hookEnd, 1.2)); }
  // liquid-glass sheen: a slow specular sweep across every glass surface
  const glassEls = document.querySelectorAll('.card, .brandp, .vs .side, .bigword, .flow .node, .badge, .glass');
  if (glassEls.length) tl.fromTo(glassEls, { '--gx': '-40%' }, { '--gx': '150%', duration: 3.2, ease: 'sine.inOut', repeat: Math.ceil(data.duration / 3.2), stagger: { each: 0.15, from: 'start' }, immediateRender: false }, 0.2);
  if (data.coldOpen) {
    const C = data.coldOpen;
    window.ColdOpen.build(tl, data);
    window.smoothWin.push([0, C.end + 0.5]);
    tl.set('.caps', { opacity: 0 }, 0).set('.caps', { opacity: 1 }, C.end);
    // hand-off: whatever scene / face is live when the gag ends slides up into place
    const live = data.scenes.findIndex((s) => s.t <= C.end + 0.01 && s.end > C.end);
    if (live >= 0) { const el = document.getElementById('s' + live); tl.fromTo(el.firstElementChild, { y: 90, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.42, ease: 'power3.out', immediateRender: false }, C.end + 0.04); }
    if (data.face) tl.fromTo('#face', { y: 140 }, { y: 0, duration: 0.45, ease: 'power3.out', immediateRender: false }, C.end + 0.04);
    window.sfx = window.sfx.filter((c) => c.co || c.t >= C.end - 0.05);
  }
  if (data.rail) {   // what-if timeline rail: centres the active stage, fills the meter (stage.meter 0 to 100)
    const st = data.scenes.filter((s) => s.type === 'stage');
    if (st.length) { tl.fromTo('#rail', { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out', immediateRender: false }, st[0].t).set('#rail', { opacity: 0 }, st.at(-1).out ?? st.at(-1).end); }
    let prev = 0;
    st.forEach((s, k) => {
      tl.to('#rtrack', { x: 480 - 120 - k * 240, duration: 0.45, ease: 'power3.inOut' }, s.t);
      st.forEach((_, j) => tl.set(`#ri${j}`, { color: j === k ? '#E8B84B' : j < k ? 'rgba(255,255,255,.85)' : 'rgba(255,255,255,.45)', scale: j === k ? 1.18 : 1 }, s.t + 0.2));
      tl.set(`#ri${k} i`, { backgroundColor: '#E8B84B', boxShadow: '0 0 0 8px rgba(232,184,75,.3)' }, s.t + 0.2);
      if (s.meter !== undefined && document.getElementById('rfill')) {
        const o = { v: prev }, num = document.getElementById('rnum');
        tl.to('#rfill', { width: `${s.meter}%`, duration: 0.6, ease: 'power2.out' }, s.t + 0.3)
          .to(o, { v: s.meter, duration: 0.6, ease: 'power2.out', onUpdate: () => { num.textContent = `${Math.round(o.v)}/100`; } }, s.t + 0.3);
        window.sfx.push({ t: s.t + 0.3, kind: 'roll', vol: 0.06 }); prev = s.meter;
      }
    });
  }
  if (data.introSfx !== false && window.IntroSfx) window.IntroSfx.apply(tl, data);   // intro sound design (introsfx.js)
  if (window.W3D) window.W3D.build(tl, data);   // low-poly 3D layer behind any scene with w3d (world3d.js)
  tl.set({}, {}, data.duration);
  window.faceVideo = data.face ? document.getElementById('fv') : null;
  window.faceVideos = data.face ? [...document.querySelectorAll('#face video')] : [];
  window.clipVideos = [...document.querySelectorAll('video.clipv')];
  const STEP = data.stop !== false ? 12 : 0;
  window.seek = (t) => {
    const smooth = (window.smoothWin || []).some(([a, b]) => t >= a && t <= b);
    const ts = STEP && !smooth ? Math.floor(t * STEP) / STEP : t;
    tl.seek(Math.max(ts, 0.0005), false);   // never exactly 0: GSAP skips zero-position sets on a fresh timeline
    if (window.W3D) window.W3D.render(ts);
    if (STEP && !smooth) {
      const k = Math.floor(t * STEP);
      document.querySelectorAll('.scene > *:not(:has(.card, .shot, .flow, .brandp, .bigword, .glass, .vs, .person)), .pop, .tgt').forEach((el, j) => { el.style.translate = `${((k * 13 + j * 7) % 5) - 2}px ${((k * 7 + j * 3) % 5) - 2}px`; el.style.rotate = `${(((k * 31 + j * 17) % 7) - 3) * 0.35}deg`; });
      document.querySelectorAll('.scrap').forEach((el, j) => { el.style.translate = `0 ${-((k * (2 + j % 3)) % 1900)}px`; });
    }
  };
  window.seek(0);
};
