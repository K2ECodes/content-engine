<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../_base/brand.css">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<style>
  /* Story reel: motion-graphics-led, word-timed (research/style-nick-saraev.md). 1080x1920. */
  .canvas { width: 1080px; height: 1920px; }
  .world { position: absolute; inset: 0; }
  .world.dark { background: var(--ink); }
  .world.dark::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(245,240,232,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(245,240,232,.05) 1px, transparent 1px); background-size: 90px 90px; }
  .world.dark::after { content: ''; position: absolute; left: 50%; top: -200px; width: 1400px; height: 1500px; transform: translateX(-50%); background: radial-gradient(ellipse at 50% 0%, rgba(245,240,232,.09), transparent 60%); }
  .world.light { background: var(--cream); }
  .world.light::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(23,40,28,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(23,40,28,.06) 1px, transparent 1px); background-size: 90px 90px; }
  .vibe { position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(110px); opacity: .55; mix-blend-mode: screen; }
  .light-on .blob { mix-blend-mode: multiply; opacity: .32; }
  .blob.b1 { background: #E8B84B; left: -300px; top: 100px; opacity: .4; }
  .blob.b2 { background: var(--vb, #C98A3C); right: -350px; top: 700px; }
  .blob.b3 { background: #2E6B45; left: 120px; bottom: -380px; }
  .blob.b4 { background: var(--vb, #C98A3C); right: -200px; top: -250px; opacity: .5; }
  .flogo { position: absolute; width: 120px; height: 120px; border-radius: 30%; display: grid; place-items: center; opacity: .38; box-shadow: 0 10px 24px rgba(0,0,0,.3); }
  .flogo img { width: 64%; height: 64%; object-fit: contain; }
  .ray { position: absolute; left: 50%; top: 45%; width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.05) 0 8deg, transparent 8deg 22deg); border-radius: 50%; }
  .light-on .ray { background: repeating-conic-gradient(from 0deg, rgba(23,40,28,.045) 0 8deg, transparent 8deg 22deg); }
  .dust { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); opacity: .3; }

  /* Captions */
  .caps { position: absolute; left: 70px; right: 150px; top: 1180px; text-align: center; font: 700 78px/1.05 var(--f-head); transition: none; z-index: 5; }
  .caps .line { position: absolute; left: 0; right: 0; top: 0; }
  .caps .w { display: inline-block; margin: 0 .12em; position: relative; opacity: 0; }
  .dark-on .caps { color: var(--cream); }
  .light-on .caps { color: var(--ink); }
  .caps .w.box::before { content: ''; position: absolute; inset: -6px -12px; border: 3px solid var(--kc); background: color-mix(in srgb, var(--kc) 18%, transparent); border-radius: 4px; transform-origin: left; transform: scaleX(var(--bx, 0)); }
  .caps .w.strike::after { content: ''; position: absolute; left: -4px; right: -4px; top: 52%; height: 6px; background: var(--orange); transform-origin: left; transform: scaleX(var(--sx, 0)); }
  .dark-on { --kc: var(--gold); }
  .light-on { --kc: var(--orange); }

  /* Scenes */
  .scene { position: absolute; left: 0; right: 0; top: 240px; bottom: 770px; display: flex; align-items: center; justify-content: center; opacity: 0; }
  .scene > * { zoom: .84; }
  .card { width: 900px; border-radius: 24px; overflow: hidden; }
  .dark .card, .card.d { background: #1F3426; border: 1px solid rgba(156,202,160,.25); box-shadow: 0 0 40px rgba(232,184,75,.08) inset, 0 30px 80px rgba(0,0,0,.35); color: var(--cream); }
  .light .card, .card.l { background: #fff; border: 1px solid rgba(23,40,28,.12); box-shadow: 0 24px 60px rgba(23,40,28,.12); color: var(--ink); }
  .win-bar { display: flex; align-items: center; gap: 12px; padding: 26px 32px; border-bottom: 1px solid rgba(127,127,127,.18); font: 700 32px/1 var(--f-data); }
  .win-bar i { width: 18px; height: 18px; border-radius: 50%; background: rgba(127,127,127,.35); display: inline-block; }
  .win-bar span { margin-left: 14px; }
  .win-bar b { margin-left: auto; font: 700 24px/1 var(--f-data); color: var(--sage); }
  .rows { padding: 12px 32px 26px; }
  .r { display: flex; align-items: center; gap: 24px; padding: 26px 0; border-bottom: 1px solid rgba(127,127,127,.14); font: 600 46px/1.1 var(--f-head); opacity: 0; }
  .r .dot { width: 60px; height: 60px; border-radius: 50%; background: rgba(156,202,160,.35); flex: none; display: grid; place-items: center; font: 700 22px var(--f-data); }
  .r .val { margin-left: auto; font: 700 38px/1 var(--f-data); }
  .chip { font: 700 28px/1 var(--f-data); padding: 12px 18px; border-radius: 999px; }
  .chip.ok { background: var(--sage); color: var(--ink); }
  .chip.bad { background: var(--orange); color: var(--ink); }
  .chip.wait { background: rgba(232,184,75,.25); color: inherit; }
  .r .tick { width: 54px; height: 54px; border-radius: 10px; border: 3px solid currentColor; flex: none; position: relative; opacity: .8; }
  .r .tick svg { position: absolute; inset: 3px; stroke: var(--sage); stroke-width: 6; fill: none; stroke-dasharray: 40; stroke-dashoffset: 40; }

  .odo { padding: 46px 40px 40px; text-align: center; }
  .odo .digits { display: inline-flex; gap: 6px; font: 700 190px/1 var(--f-data); color: var(--gold); }
  .light .odo .digits { color: var(--orange); }
  .odo .d { display: inline-block; height: 1em; overflow: hidden; }
  .odo .d .col { display: flex; flex-direction: column; }
  .odo .d .col span { height: 1em; }
  .odo .lbl { margin-top: 22px; font: 600 46px/1.2 var(--f-head); opacity: .8; }

  .receipt-wrap { position: relative; width: 900px; height: 1100px; }
  .printer { position: absolute; left: 0; right: 0; top: 0; height: 120px; border-radius: 24px; background: #2A4432; border: 1px solid rgba(156,202,160,.3); box-shadow: 0 20px 50px rgba(0,0,0,.3); z-index: 2; }
  .light .printer { background: var(--ink); }
  .printer::after { content: ''; position: absolute; left: 70px; right: 70px; bottom: 26px; height: 10px; border-radius: 5px; background: #0d1a11; }
  .paper { position: absolute; left: 70px; right: 70px; top: 100px; background: #FBF8F2; color: var(--ink); clip-path: inset(0 0 100% 0); padding: 60px 44px 70px; font: 600 38px/1.7 var(--f-data); box-shadow: 0 20px 40px rgba(0,0,0,.25);
           mask-image: linear-gradient(#000 96%, transparent); }
  .paper .ln { display: flex; justify-content: space-between; }
  .paper .ln.miss { color: var(--orange); }
  .paper .tot { margin-top: 28px; padding-top: 22px; border-top: 3px dashed rgba(23,40,28,.4); display: flex; justify-content: space-between; font-size: 50px; font-weight: 700; }

  .bigword { font: 900 150px/1 var(--f-display); letter-spacing: .04em; padding: 40px 60px 34px; border-radius: 18px; background: var(--gold); color: var(--ink); box-shadow: 0 0 80px rgba(232,184,75,.35); }
  .cta-stack { display: flex; flex-direction: column; align-items: center; gap: 50px; }
  .cbox { width: 900px; padding: 32px 34px; border-radius: 22px; font: 600 44px/1.2 var(--f-head); display: flex; align-items: center; gap: 18px; }
  .cbox .avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--sage); flex: none; }
  .cbox .typed::after { content: '|'; color: var(--orange); margin-left: 4px; }
  .dm { opacity: 0; }

  .stat-card { padding: 54px 50px; text-align: center; }
  .stat-card .v { font: 700 200px/1 var(--f-head); color: var(--gold); }
  .light .stat-card .v { color: var(--orange); }
  .stat-card .l { margin-top: 18px; font: 600 40px/1.2 var(--f-head); }
  .foot { position: absolute; right: 80px; bottom: 300px; font: 400 20px/1 var(--f-label); opacity: .55; }
  .dark .foot { color: var(--cream); }

  .shot { width: 940px; border-radius: 20px; overflow: hidden; background: #fff; border: 4px solid var(--ink); box-shadow: 0 30px 80px rgba(0,0,0,.4); }
  .shot .bar { display: flex; align-items: center; gap: 10px; padding: 16px 22px; background: #EDE7DC; font: 600 24px/1 var(--f-data); color: #444; }
  .shot .bar i { width: 14px; height: 14px; border-radius: 50%; background: rgba(0,0,0,.2); display: inline-block; }
  .shot .bar span { margin-left: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .shot .img { height: var(--sh, 760px); overflow: hidden; }
  .shot .img img { width: 100%; display: block; transform-origin: 50% 0; }
  .shot-cap { margin-top: 26px; text-align: center; font: 700 44px/1.15 var(--f-head); color: var(--cream); text-shadow: 0 3px 10px rgba(0,0,0,.6); }
  .light .shot-cap { color: var(--ink); text-shadow: none; }
  .brandp { width: 900px; border-radius: 36px; padding: 70px 60px 60px; text-align: center; background: var(--bbg); color: var(--bfg); box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 0 0 6px rgba(255,255,255,.12); }
  .brandp .tile { width: 260px; height: 260px; margin: 0 auto 36px; border-radius: 56px; background: var(--btile); display: grid; place-items: center; box-shadow: 0 16px 40px rgba(0,0,0,.3); }
  .brandp .tile img { width: 64%; height: 64%; object-fit: contain; }
  .brandp h2 { font: 700 96px/1 var(--f-head); }
  .brandp p { margin-top: 18px; font: 600 46px/1.2 var(--f-head); opacity: .92; }
  .vs { display: flex; align-items: center; gap: 30px; }
  .vs .side { width: 400px; height: 560px; border-radius: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; background: var(--bbg); color: var(--bfg); box-shadow: 0 24px 60px rgba(0,0,0,.4); }
  .vs .side .tile { width: 210px; height: 210px; border-radius: 46px; background: var(--btile); display: grid; place-items: center; }
  .vs .side .tile img { width: 64%; height: 64%; object-fit: contain; }
  .vs .side b { font: 700 60px/1 var(--f-head); }
  .vs .side .tag { font: 700 30px/1 var(--f-data); padding: 10px 18px; border-radius: 30px; background: rgba(255,255,255,.9); color: #111; }
  .vs .mid { font: 900 110px/1 var(--f-display); color: var(--gold); text-shadow: 0 6px 0 var(--ink), 0 0 30px rgba(232,184,75,.6); }
  .pop { position: absolute; z-index: 6; opacity: 0; transform-origin: 50% 50%; }
  .pop.logo { border-radius: 30%; display: grid; place-items: center; box-shadow: 0 14px 30px rgba(0,0,0,.35); }
  .pop.logo img { width: 66%; height: 66%; object-fit: contain; }
  .pop.sprite img { width: 100%; image-rendering: pixelated; filter: drop-shadow(0 10px 14px rgba(0,0,0,.35)); }
  .pop.burst { display: grid; place-items: center; text-align: center; font: 400 var(--bs, 46px)/0.95 'Anton', var(--f-head); text-transform: uppercase; color: var(--ink); }
  .pop.burst svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .pop.burst svg polygon { stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
  .pop.burst span { position: relative; }
  .pop.text { font: 700 var(--bs, 64px)/1 'Caveat', cursive; color: var(--gold); text-shadow: 0 4px 0 var(--ink); white-space: nowrap; }
  .hook { position: absolute; inset: 0; z-index: 7; pointer-events: none; }
  .hook .tgt { position: absolute; width: 200px; height: 200px; border-radius: 30%; display: grid; place-items: center; box-shadow: 0 16px 34px rgba(0,0,0,.45); }
  .hook .tgt img { width: 64%; height: 64%; object-fit: contain; }
  .hook .shard { position: absolute; width: 34px; height: 34px; border-radius: 4px; }
  .hook .bolt { position: absolute; width: 70px; height: 14px; border-radius: 7px; background: #FFE066; box-shadow: 0 0 18px #FFB000, 0 0 4px #fff; }
  .hook .gun { position: absolute; left: -40px; top: 1120px; width: 380px; height: 150px; }
  .hook .gun i { position: absolute; background: #1b1b1b; border: 5px solid #000; }
  .hook .flash { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, #fff 0 20%, #FFE066 35%, rgba(255,140,0,0) 70%); opacity: 0; }
  .hook .ko { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font: 900 170px/1 var(--f-display); color: var(--gold); text-shadow: 0 8px 0 #000; opacity: 0; }
  .hook .bar { position: absolute; left: -20px; right: -20px; top: 300px; height: 150px; background: #D7261E; color: #fff; display: flex; align-items: center; gap: 30px; padding: 0 60px; font: 900 96px/1 var(--f-display); letter-spacing: .04em; opacity: 0; box-shadow: 0 10px 0 #000; }
  .hook .bar span { font: 700 44px/1 var(--f-head); background: #fff; color: #D7261E; padding: 10px 18px; letter-spacing: 0; }
  .hook .ticker { position: absolute; left: 0; right: 0; top: 450px; height: 70px; background: #111; color: #fff; font: 700 40px/70px var(--f-head); white-space: nowrap; overflow: hidden; opacity: 0; }
  .hook .ticker b { display: inline-block; padding-left: 1080px; }
  .hook .glitch { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0 3px, transparent 3px 7px); opacity: 0; mix-blend-mode: overlay; }
  .hook .shotz { position: absolute; left: 90px; right: 90px; top: 360px; border: 8px solid #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6); opacity: 0; }
  .hook .shotz img { width: 100%; display: block; }
  .hook .crack { position: absolute; width: 260px; height: 40px; opacity: 0; }
  .hook .dust { position: absolute; width: 360px; height: 120px; border-radius: 50%; background: radial-gradient(ellipse, rgba(245,240,232,.75), rgba(245,240,232,0) 70%); opacity: 0; }
  .stamp { position: absolute; z-index: 6; font: 900 96px/1 var(--f-display); letter-spacing: .06em; padding: 18px 34px 12px; border: 8px solid; border-radius: 10px; transform: rotate(-8deg); opacity: 0; }
  .stamp.ok { color: #5f9a66; border-color: #5f9a66; }
  .stamp.bad { color: var(--orange); border-color: var(--orange); }

  .cursor { position: absolute; z-index: 7; width: 54px; height: 54px; opacity: 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  .ripple { position: absolute; z-index: 6; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 4px solid var(--gold); opacity: 0; }

  /* Face plate (HeyGen take, transcoded to webm by render.mjs) */
  .face { position: absolute; overflow: hidden; opacity: 0; z-index: 3; }
  .face video { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; transform-origin: 50% 45%; }
  .face.full { left: 0; right: 0; top: -170px; height: 1350px; }
  .face.full.cut, .face.split.cut { background: transparent; }
  .facebg { position: absolute; inset: 0; z-index: 2; opacity: 0; background-size: cover; background-position: 50% 40%; filter: blur(2px) saturate(1.1); transform: scale(1.04); }
  .face.cut::after { display: none; }
  .face.cut video.plain { display: none; }
  .face:not(.cut) video.cutv { display: none; }
  .face.cut video { filter: drop-shadow(0 0 2px rgba(0,0,0,.5)) drop-shadow(0 18px 30px rgba(0,0,0,.35)); }
  .face.split { left: 0; right: 0; top: 960px; bottom: 0; }
  .face.pip { right: 60px; bottom: 300px; width: 300px; height: 300px; border-radius: 40px; border: 3px solid var(--gold); }
  .face.corner { left: 300px; top: 1040px; width: 780px; height: 880px; z-index: 5; }
  .face.corner video { object-position: 50% 28%; }
  .face.corner:not(.cut) { border-radius: 40px 0 0 0; border: 4px solid var(--gold); border-right: 0; border-bottom: 0; }
  .mark { position: absolute; right: 60px; top: 70px; width: 56px; z-index: 6; }
  .badge { position: absolute; left: 40px; top: 1540px; z-index: 6; display: flex; align-items: center; gap: 16px; padding: 14px 24px 14px 16px; border-radius: 18px; background: rgba(23,40,28,.92); border: 3px solid var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,.4), 0 0 24px rgba(232,184,75,.35); }
  .badge img.b { width: 46px; filter: drop-shadow(0 0 10px rgba(156,202,160,.8)); }
  .badge img.w { height: 26px; }
  .branded .mark { width: 92px; top: 60px; right: 50px; filter: drop-shadow(0 0 16px rgba(156,202,160,.9)); }
  .scenes { position: absolute; inset: 0; z-index: 4; }
  .sticker { position: absolute; z-index: 5; opacity: 0; transform-origin: 50% 100%; filter: drop-shadow(0 0 3px rgba(0,0,0,.6)) drop-shadow(0 20px 30px rgba(0,0,0,.4)); }
  .scenes.split .scene { top: 230px; bottom: 1110px; }
  .scenes.split .scene > * { zoom: .62; }
  .scenes.corner .scene { top: 230px; bottom: 1100px; }
  .scenes.corner .scene > * { zoom: .66; }
  .caps.seam { top: 845px; }
  .caps.above { top: 860px; }
  .scenes.full .scene { visibility: hidden; }
  .face.split::after, .face.full::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 120px rgba(23,40,28,.35); pointer-events: none; }
  .face.split { border-top: 4px solid var(--gold); }
</style>
</head>
<body>
<div id="root"></div>
<script>
// data (resolved by render.mjs): { duration, words:[{w,start,end}], scenes:[{t, end, world, type, ...}], keys:[word], strikes:[word], face:{src}|null, faceCuts:[{t, layout, zoom}] }
// Scene types: list {title, badge, rows:[{text, val, chip, chipKind, t}]} | checklist {title, rows:[{text,t}]} | odometer {value, prefix, suffix, label, land}
//              receipt {lines:[{text, val, miss, t}], total:{text,val}, totalT} | stat {value, label, foot} | word {text} | cta {keyword, prompt, dm}
// Overlays (scene.stamp {text, kind, t}, scene.click {t, x, y})
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TICK = '<svg viewBox="0 0 36 36"><path d="M6 19l8 8L30 9"/></svg>';
const CURSOR = '<svg viewBox="0 0 24 24"><path d="M4 2l16 10.5-7 1.5 4 7.5-3 1.5-4-7.5-6 5z" fill="#F5F0E8" stroke="#17281C" stroke-width="1.5"/></svg>';
const cardCls = (sc) => '';
const burst = (color) => { const pts = []; for (let i = 0; i < 24; i++) { const r = i % 2 ? 40 : 50, a = (i / 24) * Math.PI * 2; pts.push(`${50 + r * Math.cos(a)},${50 + r * Math.sin(a)}`); } return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="${pts.join(' ')}" fill="${color}"/></svg>`; };
const BGS = { 'pixel-day': '../../assets/pixel/sky-day.png', 'pixel-night': '../../assets/pixel/sky-night.png', 'pixel-sunset': '../../assets/pixel/sky-sunset.png', 'pixel-neon': '../../assets/pixel/sky-neon.png',
  loft: '../../assets/talking-head/backgrounds/loft-office.png', library: '../../assets/talking-head/backgrounds/library.png',
  studio: '../../assets/talking-head/backgrounds/studio-plants.png', 'city-dusk': '../../assets/talking-head/backgrounds/city-dusk.png' };

const BUILD = {
  list: (s) => `<div class="card"><div class="win-bar"><i></i><i></i><i></i><span>${esc(s.title)}</span>${s.badge ? `<b>${esc(s.badge)}</b>` : ''}</div><div class="rows">${s.rows.map((r) =>
    `<div class="r"><div class="dot">${esc((r.text || '?')[0])}</div><span>${esc(r.text)}</span>${r.val ? `<span class="val">${esc(r.val)}</span>` : ''}${r.chip ? `<span class="chip ${r.chipKind || 'ok'}">${esc(r.chip)}</span>` : ''}</div>`).join('')}</div></div>`,
  checklist: (s) => `<div class="card"><div class="win-bar"><i></i><i></i><i></i><span>${esc(s.title)}</span></div><div class="rows">${s.rows.map((r) =>
    `<div class="r"><div class="tick">${TICK}</div><span>${esc(r.text)}</span></div>`).join('')}</div></div>`,
  odometer: (s) => { const str = String(s.value); return `<div class="card"><div class="odo"><div class="digits" style="font-size:${Math.min(190, Math.floor(1180 / (str.length + (s.prefix || '').length + (s.suffix || '').length)))}px">${esc(s.prefix || '')}${[...str].map((ch) => /\d/.test(ch)
    ? `<span class="d"><span class="col">${Array.from({ length: 20 }, (_, i) => `<span>${i % 10}</span>`).join('')}</span></span>` : `<span>${esc(ch)}</span>`).join('')}${esc(s.suffix || '')}</div><div class="lbl">${esc(s.label)}</div></div></div>`; },
  receipt: (s) => `<div class="receipt-wrap"><div class="printer"></div><div class="paper">${s.lines.map((l) => `<div class="ln${l.miss ? ' miss' : ''}"><span>${esc(l.text)}</span><span>${esc(l.val)}</span></div>`).join('')}${s.total ? `<div class="tot"><span>${esc(s.total.text)}</span><span>${esc(s.total.val)}</span></div>` : ''}</div></div>`,
  stat: (s) => `<div class="card"><div class="stat-card"><div class="v">${esc(s.value)}</div><div class="l">${esc(s.label)}</div></div></div>${s.foot ? `<div class="foot">${esc(s.foot)}</div>` : ''}`,
  word: (s) => `<div class="bigword">${esc(s.text)}</div>`,
  brand: (s) => `<div class="brandp" style="--bbg:${s.b.bg};--bfg:${s.b.fg};--btile:${s.b.tile}"><div class="tile"><img src="${s.b.logoUrl}"></div><h2>${esc(s.title || s.b.name)}</h2>${s.sub ? `<p>${esc(s.sub)}</p>` : ''}</div>`,
  vs: (s) => `<div class="vs">${[s.lb, s.rb].map((b, i) => `<div class="side" style="--bbg:${b.bg};--bfg:${b.fg};--btile:${b.tile}"><div class="tile"><img src="${b.logoUrl}"></div><b>${esc(b.name)}</b>${(i ? s.rtag : s.ltag) ? `<span class="tag">${esc(i ? s.rtag : s.ltag)}</span>` : ''}</div>${i ? '' : '<div class="mid">VS</div>'}`).join('')}</div>`,

function sceneIn(tl, el, s) {
  tl.set(el, { opacity: 1 }, s.t);
  const inner = el.firstElementChild;
  tl.fromTo(inner, { scale: 0.92, opacity: 0, filter: 'blur(12px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.3, ease: 'back.out(1.4)', immediateRender: false }, s.t);
  tl.fromTo(el, { scale: 1 }, { scale: 1.04, duration: Math.max(0.5, s.end - s.t), ease: 'none' }, s.t);
  tl.set(el, { opacity: 0 }, s.end);
  window.sfx.push({ t: s.t, kind: 'tick' });
}

const ANIMATE = {
  list: (tl, el, s) => el.querySelectorAll('.r').forEach((r, i) => {
    const t = s.rows[i].t ?? s.t + 0.35 + i * 0.35;
    tl.fromTo(r, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.22, ease: 'power2.out' }, t);
  }),
  checklist: (tl, el, s) => el.querySelectorAll('.r').forEach((r, i) => {
    const t = s.rows[i].t ?? s.t + 0.35 + i * 0.5;
    tl.fromTo(r, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.2 }, t - 0.15).to(r.querySelector('svg'), { strokeDashoffset: 0, duration: 0.2 }, t);
    window.sfx.push({ t, kind: 'click' });
  }),
  odometer: (tl, el, s) => {
    const str = String(s.value), cols = el.querySelectorAll('.d .col');
    let k = 0;
    [...str].forEach((ch) => { if (!/\d/.test(ch)) return; const col = cols[k++]; const target = 10 + Number(ch);
      tl.fromTo(col, { y: 0 }, { y: `-${target}em`, duration: Math.max(0.5, (s.land ?? s.t + 0.8) - s.t - 0.05 * (cols.length - k)), ease: 'power3.out' }, s.t + 0.05 * k); });
    window.sfx.push({ t: s.t + 0.1, kind: 'roll' }, { t: s.land ?? s.t + 0.8, kind: 'tick' });
  },
  receipt: (tl, el, s) => {
    const paper = el.querySelector('.paper'), n = s.lines.length + (s.total ? 2 : 0);
    const end = s.totalT ?? s.end - 0.6;
    s.lines.forEach((l, i) => { const t = l.t ?? s.t + 0.3 + i * ((end - s.t - 0.3) / n);
      tl.to(paper, { clipPath: `inset(0 0 ${Math.round(100 - ((i + 1) / n) * 100)}% 0)`, duration: 0.25, ease: 'none' }, t); window.sfx.push({ t, kind: 'print' }); });
    tl.to(paper, { clipPath: 'inset(0 0 0% 0)', duration: 0.3, ease: 'none' }, end);
    window.sfx.push({ t: end, kind: 'print' });
  },
  stat: () => {},
  word: () => {},
  brand: (tl, el, s) => { tl.fromTo(el.querySelector('.tile'), { rotation: -20, scale: 0.4 }, { rotation: 0, scale: 1, duration: 0.45, ease: 'back.out(2.2)', immediateRender: false }, s.t + 0.05); window.sfx.push({ t: s.t + 0.1, kind: 'pop' }); },
  vs: (tl, el, s) => { const sides = el.querySelectorAll('.side'); tl.fromTo(sides[0], { x: -500 }, { x: 0, duration: 0.35, ease: 'power3.out', immediateRender: false }, s.t).fromTo(sides[1], { x: 500 }, { x: 0, duration: 0.35, ease: 'power3.out', immediateRender: false }, s.t + 0.15)
    .fromTo(el.querySelector('.mid'), { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: 'power4.in', immediateRender: false }, s.t + 0.45); window.sfx.push({ t: s.t, kind: 'whoosh' }, { t: s.t + 0.7, kind: 'thud' }); },
  shot: (tl, el, s) => { const img = el.querySelector('.shot img'); tl.fromTo(img, { scale: 1.0, y: 0 }, { scale: 1.12, y: -(s.pan ?? 60), duration: Math.max(1, s.end - s.t), ease: 'none' }, s.t); },
  cta: (tl, el, s) => {
    const tx = el.querySelector('.typed'), msg = s.prompt || s.keyword, o = { n: 0 };
    tl.to(o, { n: msg.length, duration: msg.length / 12, ease: `steps(${msg.length})`, onUpdate: () => { tx.textContent = msg.slice(0, Math.round(o.n)); } }, s.t + 0.5);
    for (let i = 0; i < msg.length; i += 2) window.sfx.push({ t: s.t + 0.5 + i / 12, kind: 'key' });
    const dm = el.querySelector('.dm');
    if (dm) { const t = s.t + 0.6 + msg.length / 12 + 0.3; tl.fromTo(dm, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: 'back.out(1.6)' }, t); window.sfx.push({ t, kind: 'tick' }); }
  },
};

function sentences(words) {
  const out = []; let cur = [];
  words.forEach((w, i) => { cur.push({ ...w, i }); const txt = cur.map((x) => x.w).join(' ');
    if (/[.?]$/.test(w.w) || (/[,;:]$/.test(w.w) && cur.length >= 5) || cur.length >= 9 || txt.length > 46) { out.push(cur); cur = []; } });
  if (cur.length) out.push(cur);
  return out;
}

      for (let k = 0; k < 2; k++) {
        const bolt = document.getElementById('hb' + ((i * 2 + k) % 10));
        tl.fromTo(bolt, { opacity: 1, left: 370, top: 1175, rotation: Math.atan2(ty - 1175, tx - 370) * 57.3 }, { left: tx, top: ty, duration: 0.12, ease: 'none', immediateRender: false }, t0 + k * 0.07).set(bolt, { opacity: 0 }, t0 + k * 0.07 + 0.12);
        tl.fromTo('#hflash', { opacity: 1, scale: 0.6 }, { opacity: 0, scale: 1.3, duration: 0.08, immediateRender: false }, t0 + k * 0.07);
        tl.fromTo('#hook .gun', { x: -14 }, { x: 0, duration: 0.06, immediateRender: false }, t0 + k * 0.07);
        window.sfx.push({ t: t0 + k * 0.07, kind: 'blast' });
      }
      const hit = t0 + 0.2;
      tl.fromTo(el, { filter: 'brightness(1)' }, { filter: 'brightness(3)', duration: 0.05, yoyo: true, repeat: 1, immediateRender: false }, hit).set(el, { opacity: 0 }, hit + 0.12);
      for (let k = 0; k < 6; k++) { const sh = document.getElementById('hs' + (i * 6 + k)), a = (k / 6) * Math.PI * 2;
        tl.fromTo(sh, { opacity: 1, left: tx, top: ty, rotation: 0 }, { left: tx + Math.cos(a) * 260, top: ty + Math.sin(a) * 260 + 160, rotation: 220, opacity: 0, duration: 0.55, ease: 'power2.out', immediateRender: false }, hit + 0.1); }
      window.sfx.push({ t: hit + 0.1, kind: 'thud' });
    });
    const end = 0.15 + n * per + 0.25;
    if (H.text) tl.fromTo('#hko', { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.18, ease: 'power4.in', immediateRender: false }, end - 0.2).to('#hko', { opacity: 0, duration: 0.15 }, end + 0.45);
    tl.set('#hook', { opacity: 0 }, end + 0.6);
    window.hookEnd = end + 0.6;
  }
  (data.pops || []).forEach((p, i) => {
    const el = document.getElementById('p' + i), end = p.end ?? p.t + 1.6;
    tl.fromTo(el, { opacity: 0, scale: 0.2, rotation: (p.rot ?? 0) - 25 }, { opacity: 1, scale: 1, rotation: p.rot ?? 0, duration: 0.28, ease: 'back.out(2.6)', immediateRender: false }, p.t);
    tl.to(el, { scale: 1.06, duration: 0.3, yoyo: true, repeat: 1, ease: 'sine.inOut' }, p.t + 0.3);
    tl.to(el, { opacity: 0, scale: 0.6, duration: 0.15 }, end);
    window.sfx.push({ t: p.t, kind: 'pop' });
  });
  (data.stickers || []).forEach((k, i) => {
    const el = document.getElementById('k' + i);
    tl.fromTo(el, { opacity: 0, scale: 0.6, rotation: -6 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.3, ease: 'back.out(2)', immediateRender: false }, k.t);
    tl.to(el, { y: -8, duration: 0.6, yoyo: true, repeat: Math.max(0, Math.floor((k.end - k.t) / 0.6) - 1), ease: 'sine.inOut' }, k.t + 0.3);
    tl.set(el, { opacity: 0 }, k.end);
    window.sfx.push({ t: k.t, kind: 'tick' });
  });
  if (data.branded) { tl.set('#badge', { opacity: 0 }, 0).fromTo('#badge', { opacity: 1, x: -500 }, { x: 0, duration: 0.4, ease: 'back.out(1.6)', immediateRender: false }, Math.max(0, data.duration - 3.2)); tl.to('#cv .mark', { rotation: 360, duration: 0.8, ease: 'back.out(1.4)' }, 0.1); }
  if (data.hook && window.hookEnd) { tl.set('#scs', { opacity: 0 }, 0).set('#scs', { opacity: 1 }, window.hookEnd); tl.set('.caps', { opacity: 0 }, 0).set('.caps', { opacity: 1 }, Math.min(window.hookEnd, 1.2)); }
  tl.set({}, {}, data.duration);
  window.faceVideo = data.face ? document.getElementById('fv') : null;
  window.faceVideos = data.face ? [...document.querySelectorAll('#face video')] : [];
  window.seek = (t) => { tl.seek(t, false); };
  window.seek(0);
};
</script>
