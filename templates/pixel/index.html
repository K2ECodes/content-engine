<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../_base/brand.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Silkscreen:wght@400;700&display=block" rel="stylesheet">
<style>
  /* Content Systems.ai pixel-world carousel: the 8-bit platformer world from the brand's "Our Story" posts,
     with Albert Olgaard-style headline / card / annotation layout. 1080x1350. */
  .canvas { width: 1080px; height: 1350px; }
  .sky { position: absolute; inset: 0; background-size: cover; background-position: center bottom; image-rendering: pixelated; }
  .day { --hl: #17281C; --acc: #C2591F; --note: #17281C; --foot: #F5F0E8; --hls: 0 4px 0 rgba(255,255,255,.75); }
  .night { --hl: #F5F0E8; --acc: #E8B84B; --note: #F5F0E8; --foot: #F5F0E8; --hls: 0 5px 0 #0b1a33, 0 0 18px rgba(11,26,51,.9); }
  .sunset { --hl: #FFF6E8; --acc: #FFE066; --note: #FFF6E8; --foot: #F5F0E8; --hls: 0 5px 0 #5a2346, 0 0 16px rgba(90,35,70,.7); }
  .neon { --hl: #FFFFFF; --acc: #3FF2FF; --acc2: #FF4FD8; --note: #FF9BEA; --foot: #CFFAFF; --hls: 0 0 14px #FF4FD8, 0 5px 0 #2a0b3d; }
  .neon .card { border-color: #3FF2FF; box-shadow: 10px 10px 0 #FF4FD8; }
  .sunset .card { box-shadow: 10px 10px 0 #5a2346; }
  .collage { position: absolute; background: #fff; padding: 12px 12px 14px; box-shadow: 0 18px 40px rgba(0,0,0,.45); border-radius: 6px; z-index: 3; }
  .collage img { display: block; width: 100%; max-height: var(--ch, 400px); object-fit: cover; object-position: var(--cp, 50% 62%); border-radius: 3px; }
  .collage .tape { position: absolute; top: -18px; left: 50%; width: 130px; height: 38px; margin-left: -65px; background: rgba(255,230,120,.75); transform: rotate(-4deg); box-shadow: 0 2px 4px rgba(0,0,0,.15); }
  .burst { position: absolute; z-index: 6; display: grid; place-items: center; text-align: center; font: 400 var(--bs, 46px)/0.95 'Anton'; text-transform: uppercase; color: var(--ink); }
  .burst svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .burst svg polygon { stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
  .burst span { position: relative; padding: 0 10px; }
  .igcta { position: absolute; left: 70px; right: 70px; z-index: 5; }
  .igcta .cmtlbl { text-align: center; font: 700 70px/1 'Silkscreen'; color: var(--hl); text-shadow: var(--hls); margin-bottom: 18px; }
  .igcta .big { font: 700 150px/1 'Silkscreen'; text-align: center; color: var(--ink); background: var(--gold); border: 10px solid var(--ink); box-shadow: 14px 14px 0 var(--ink); padding: 34px 0 22px; letter-spacing: .02em; }
  .neon .igcta .big { background: #3FF2FF; box-shadow: 14px 14px 0 #FF4FD8; }
  .igcta .bar { margin-top: 44px; display: flex; align-items: center; gap: 20px; background: #fff; border: 6px solid var(--ink); border-radius: 60px; padding: 18px 26px; box-shadow: 8px 8px 0 var(--ink); }
  .igcta .bar .av { width: 74px; height: 74px; border-radius: 50%; background: var(--sage) url(../../assets/brand/mark.png) center/60% no-repeat; border: 4px solid var(--ink); flex: none; }
  .igcta .bar b { font: 700 52px/1 var(--f-head); color: var(--ink); }
  .igcta .bar .post { margin-left: auto; font: 700 40px/1 var(--f-head); color: #0095F6; }
  .igcta .dm { margin-top: 30px; display: flex; justify-content: center; align-items: center; gap: 18px; font: 700 54px/1 'Caveat'; color: var(--hl); text-shadow: var(--hls); }
  .igcta .dm .pill { font: 700 34px/1 var(--f-data); background: var(--sage); color: var(--ink); border: 4px solid var(--ink); border-radius: 40px; padding: 12px 22px; text-shadow: none; }
  .sprite { position: absolute; image-rendering: pixelated; z-index: 4; }

  .hl { position: absolute; left: 60px; right: 60px; top: 78px; text-align: center; font: 400 112px/0.98 'Anton', sans-serif; text-transform: uppercase; letter-spacing: .005em; color: var(--hl); text-shadow: var(--hls); }
  .hl .a { color: var(--acc); }
  .hl.s { font-size: 92px; }
  .hl.xs { font-size: 76px; }
  .uline { display: block; margin: 14px auto 0; width: 70%; height: 28px; }
  .uline path { fill: none; stroke: var(--acc); stroke-width: 7; stroke-linecap: round; }

  .card { position: absolute; left: 90px; right: 90px; background: #fff; color: var(--ink); border: 6px solid var(--ink); border-radius: 22px; box-shadow: 10px 10px 0 var(--ink); padding: 34px 40px; }
  .card.acc { border-color: var(--acc); box-shadow: 10px 10px 0 rgba(23,40,28,.85); }
  .card .t { font: 700 30px/1.2 var(--f-data); margin-bottom: 18px; color: rgba(23,40,28,.7); }
  .rows .r { display: flex; align-items: baseline; gap: 22px; font: 700 40px/1.55 var(--f-data); }
  .rows .r .k { color: var(--orange); min-width: 6.5em; }
  .bars .b { display: flex; align-items: center; gap: 18px; margin: 18px 0; min-height: 76px; font: 700 32px/1 var(--f-data); }
  .bars .track { flex: 1; height: 54px; }
  .bars .fill { height: 100%; border: 4px solid var(--ink); background: var(--sage); }
  .bars .b.hot .fill { background: var(--orange); }
  .bars .v { font: 400 70px/1 'Anton'; min-width: 1.6em; }
  .bars .foot { position: static; display: block; margin-top: 22px; white-space: normal; font: 400 22px/1.4 var(--f-data); color: rgba(23,40,28,.65); text-align: center; }
  .flow { display: flex; align-items: stretch; gap: 14px; }
  .flow .n { flex: 1; border: 4px solid rgba(23,40,28,.25); border-radius: 14px; padding: 22px 14px; text-align: center; background: #F5F0E8; }
  .flow .n.hi { border-color: var(--orange); background: #fff; }
  .flow .n h4 { font: 400 54px/1 'Anton'; text-transform: uppercase; }
  .flow .n.hi h4 { color: var(--orange); }
  .flow .n p { margin-top: 14px; font: 700 28px/1.3 var(--f-data); }
  .flow .ar { align-self: center; font: 700 44px/1 var(--f-data); color: var(--orange); }
  .flow-foot { margin-top: 18px; text-align: right; font: 700 28px/1 var(--f-data); color: var(--orange); }
  .checks .c { display: flex; gap: 20px; align-items: center; padding: 16px 0; font: 700 48px/1.15 var(--f-head); border-bottom: 3px dashed rgba(23,40,28,.15); }
  .checks .c:last-child { border-bottom: 0; }
  .checks .c b { font: 700 40px/1 'Silkscreen'; color: var(--orange); width: 48px; }
  .quote { font: 700 48px/1.3 var(--f-head); }
  .quote mark { background: #F3DE8A; padding: 0 6px; }
  .quote .who { margin-top: 18px; font: 700 24px/1 var(--f-data); color: rgba(23,40,28,.6); }
  .code { background: var(--ink); color: var(--cream); border-radius: 12px; padding: 30px 30px; font: 600 34px/1.5 var(--f-data); white-space: pre-wrap; }
  .code .k { color: var(--gold); }

  .kw { position: absolute; left: 50%; transform: translateX(-50%); font: 700 120px/1 'Silkscreen'; color: var(--ink); background: var(--gold); border: 8px solid var(--ink); box-shadow: 12px 12px 0 var(--ink); padding: 26px 46px 18px; white-space: nowrap; }

  .note { position: absolute; font: 700 58px/1.02 'Caveat', cursive; color: var(--note); text-align: center; }
  .note.acc { color: var(--acc); }
  .note svg { position: absolute; overflow: visible; }
  .note svg path { fill: none; stroke: currentColor; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }

  .foot { position: absolute; left: 44px; right: 44px; bottom: 22px; display: flex; align-items: center; justify-content: space-between; color: var(--foot); font: 700 40px/1 'Caveat', cursive; white-space: nowrap; }
  .wmrow { position: absolute; left: 0; right: 0; bottom: 92px; display: flex; justify-content: center; }
  .wmrow img { height: 80px; padding: 12px 26px; border-radius: 14px; background: #F5F0E8; border: 4px solid #17281C; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
  .paper .wmrow img { background: transparent; border: 0; box-shadow: none; padding: 0; height: 84px; }
  .foot .h { display: flex; align-items: center; gap: 14px; }
  .foot svg { width: 42px; height: 42px; stroke: currentColor; fill: none; stroke-width: 2; }
  

  /* Albert-style cover (world "paper"): cream page, faded photo, brand bar, huge 2-colour headline, handwritten aside, mystery diagram. */
  .paper { --hl: #17281C; --acc: #C2591F; --note: #17281C; --foot: #17281C; --hls: none; }
  .paper .sky { background: #F4EFE8 !important; }
  .bgph { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .2; filter: saturate(.6) blur(1.5px); }
  .paper .bgwash { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(248,244,238,.7), rgba(248,244,238,.35) 45%, rgba(248,244,238,.75)); }
  .bbar { position: absolute; left: 0; right: 0; top: 64px; display: flex; justify-content: center; align-items: center; gap: 22px; z-index: 5; font: 800 58px/1 'Inter', sans-serif; color: var(--hl); letter-spacing: -.01em; }
  .bbar img { height: 84px; width: 84px; object-fit: contain; }
  .bbar .plus { font: 400 54px/1 'Anton'; opacity: .45; }
  .hl.xl { font-size: 158px; line-height: .93; letter-spacing: -.005em; }
  .hl.withbar { top: 170px; }
  .hand { position: absolute; left: 0; right: 0; text-align: center; z-index: 5; font: 700 70px/1.05 'Caveat', cursive; color: var(--note); }
  .tree { position: absolute; left: 0; right: 0; z-index: 4; }
  .tree svg.wires { position: absolute; left: 0; top: 0; overflow: visible; }
  .tree svg.wires path { fill: none; stroke: var(--hl); stroke-width: 7; stroke-linejoin: round; }
  .tnode { position: absolute; background: #fff; border: 9px solid var(--tb, #A9C4F0); box-shadow: 0 10px 0 rgba(23,40,28,.12); display: grid; place-items: center; text-align: center; }
  .tnode img.lg { width: 62%; height: 62%; object-fit: contain; }
  .tnode img.sp { height: 78%; image-rendering: pixelated; }
  .tnode .q { font: 400 1em/1 'Anton'; color: var(--acc); }
  .tnode .lbl { position: absolute; left: 0; right: 0; bottom: -46px; font: 700 30px/1 var(--f-data); color: var(--ink); }
  .tnode .tx { font: 400 64px/1 'Anton'; text-transform: uppercase; color: var(--ink); padding: 0 10px; }
  .collage.clean { padding: 0; border-radius: 18px; overflow: hidden; border: 6px solid #fff; }
  .collage.clean img { border-radius: 0; }
  .collage.clean .tape { display: none; }
  .count { position: absolute; top: 30px; right: 40px; font: 700 22px/1 'Silkscreen'; color: var(--hl); opacity: .55; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// data: { handle, slides: [ { world: day|night, headline: ["LINE 1", "*ACCENT* LINE"], size: s|xs, underline: bool,
//   card: { y, accent, title, kind: rows|bars|flow|checks|quote|code, ... }, kw: { text, y },
//   notes: [{ text, x, y, w, accent, arrow: { x1,y1,x2,y2 } }], sprites: [{ name, x, h, y?, flip }] } ] }
// Sprites stand on the grass line (y 1108) unless y is given. All text lives here, so it's exact and linted.
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const acc = (s) => esc(s).replace(/\*(.+?)\*/g, '<span class="a">$1</span>');
const GRASS_BY_WORLD = { day: 1108, night: 1108, sunset: 1082, neon: 1052 };
let GRASS = 1108;
const burstSvg = (color) => { const pts = []; for (let i = 0; i < 24; i++) { const r = i % 2 ? 40 : 50, a = (i / 24) * Math.PI * 2; pts.push(`${50 + r * Math.cos(a)},${50 + r * Math.sin(a)}`); } return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="${pts.join(' ')}" fill="${color}"/></svg>`; };
const ICONS = {
  ig: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>',
  li: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/></svg>',
  bm: '<svg viewBox="0 0 24 24" style="fill:currentColor"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
};
const CARDS = {
  rows: (c) => `<div class="rows">${c.rows.map((r) => `<div class="r"><span class="k">${esc(r.k)}</span><span>${esc(r.v)}</span></div>`).join('')}</div>`,
  bars: (c) => { const max = Math.max(...c.bars.map((b) => b.value)); return `<div class="bars">${c.bars.map((b) =>
    `<div class="b${b.hot ? ' hot' : ''}"><span class="v">${esc(b.label)}</span><div class="track"><div class="fill" style="width:${Math.max(4, (b.value / max) * 100)}%"></div></div><span>${esc(b.name)}</span></div>`).join('')}${c.foot ? `<div class="foot">${esc(c.foot)}</div>` : ''}</div>`; },
  flow: (c) => `<div class="flow">${c.steps.map((s, i) => `${i ? '<span class="ar">&rarr;</span>' : ''}<div class="n${s.hi ? ' hi' : ''}"><h4>${esc(s.h)}</h4><p>${esc(s.p)}</p></div>`).join('')}</div>${c.foot ? `<div class="flow-foot">${esc(c.foot)}</div>` : ''}`,
  checks: (c) => `<div class="checks">${c.items.map((t) => `<div class="c"><b>&gt;</b><span>${acc(t)}</span></div>`).join('')}</div>`,
  quote: (c) => `<div class="quote">${esc(c.text).replace(/\[(.+?)\]/g, '<mark>$1</mark>')}${c.who ? `<div class="who">${esc(c.who)}</div>` : ''}</div>`,
  code: (c) => `<div class="code">${esc(c.text).replace(/\*(.+?)\*/g, '<span class="k">$1</span>')}</div>`,
};
const arrow = (a) => { const mx = (a.x1 + a.x2) / 2 + (a.bend ?? 60), my = (a.y1 + a.y2) / 2 - (a.bend ?? 60);
  const ang = Math.atan2(a.y2 - my, a.x2 - mx), h = 26;
  const p1 = [a.x2 - h * Math.cos(ang - 0.5), a.y2 - h * Math.sin(ang - 0.5)], p2 = [a.x2 - h * Math.cos(ang + 0.5), a.y2 - h * Math.sin(ang + 0.5)];
  return `<svg style="left:0;top:0;width:1px;height:1px"><path d="M${a.x1} ${a.y1} Q${mx} ${my} ${a.x2} ${a.y2}"/><path d="M${p1[0]} ${p1[1]} L${a.x2} ${a.y2} L${p2[0]} ${p2[1]}"/></svg>`; };


let BRANDS = {};
const logoUrl = (id) => `../../assets/logos/${(BRANDS[id] && BRANDS[id].logo) || id + '.svg'}`;
const nodeHtml = (n, size) => {
  const inner = n.q ? `<span class="q" style="font-size:${Math.round(size * 0.62)}px">?</span>`
    : n.brand ? `<img class="lg" src="${logoUrl(n.brand)}">` : n.sprite ? `<img class="sp" style="height:${Math.round(size * 0.74)}px" src="../../assets/pixel/sprites/${n.sprite}.png">`
    : n.img ? `<img class="lg" style="width:100%;height:100%;object-fit:cover" src="${esc(n.img)}">` : `<span class="tx">${acc(n.text)}</span>`;
  return inner + (n.label ? `<span class="lbl">${esc(n.label)}</span>` : '');
};
// tree: { y, one: node, many: [nodes], oneSize 300, manySize 200, gap 70, up: true = many on top converging into one below }
const treeHtml = (t) => {
  const W = 1080, os = t.oneSize ?? 300, ms = t.manySize ?? 200, gap = t.gap ?? 90, n = t.many.length;
  const span = n * ms + (n - 1) * (t.spread ?? 60), x0 = (W - span) / 2;
  const up = !!t.up, yOne = up ? ms + gap : 0, yMany = up ? 0 : os + gap;
  const cx = W / 2, midY = up ? ms + gap / 2 : os + gap / 2;
  let wires = '', nodes = '';
  t.many.forEach((m, i) => {
    const mx = x0 + i * (ms + (t.spread ?? 60)), mcx = mx + ms / 2;
    wires += up ? `<path d="M${mcx} ${ms} V${midY} H${cx} V${yOne}"/>` : `<path d="M${cx} ${os} V${midY} H${mcx} V${yMany}"/>`;
    nodes += `<div class="tnode" style="left:${mx}px;top:${yMany}px;width:${ms}px;height:${ms}px">${nodeHtml(m, ms)}</div>`;
  });
  nodes += `<div class="tnode" style="left:${cx - os / 2}px;top:${yOne}px;width:${os}px;height:${os}px;--tb:${t.oneBorder || 'var(--acc)'}">${nodeHtml(t.one, os)}</div>`;
  return `<div class="tree" style="top:${t.y}px;--tb:${t.border || 'color-mix(in srgb, var(--acc) 38%, white)'}"><svg class="wires" width="1" height="1">${wires}</svg>${nodes}</div>`;
};
let DATA;
window.renderPost = (data) => { DATA = data; BRANDS = data.brandsCfg || {}; window.slideCount = data.slides.length; window.showSlide(0); };
window.showSlide = (i) => {
  const s = DATA.slides[i], world = s.world || 'day';
  GRASS = GRASS_BY_WORLD[world] ?? 1108;
  const collage = (s.collage || []).map((c) => `<div class="collage${c.clean || s.world === 'paper' ? ' clean' : ''}" style="left:${c.x}px;top:${c.y}px;width:${c.w ?? 460}px;--ch:${c.h ?? 400}px;--cp:${c.pos ?? '50% 62%'};transform:rotate(${c.rot ?? 0}deg)"><div class="tape"></div><img src="${esc(c.srcUrl || c.src)}"></div>`).join('');
  const bursts = (s.bursts || []).map((b) => `<div class="burst" style="left:${b.x}px;top:${b.y}px;width:${b.w ?? 230}px;height:${b.w ?? 230}px;--bs:${b.size ?? 46}px;transform:rotate(${b.rot ?? -10}deg)">${burstSvg(b.color || '#FFE066')}<span>${esc(b.text).replace(/\n/g, '<br>')}</span></div>`).join('');
  const igcta = s.cta ? `<div class="igcta" style="top:${s.cta.y ?? 300}px">${s.cta.pill !== false && !/\s/.test(s.cta.keyword) ? '<div class="cmtlbl">COMMENT</div>' : ''}<div class="big" style="font-size:${Math.min(150, Math.floor(820 / Math.max(3, s.cta.keyword.length)))}px">${esc(s.cta.keyword)}</div><div class="bar"><div class="av"></div><b>${esc(s.cta.keyword)}</b><span class="post">Post</span></div><div class="dm">${esc(s.cta.line || "comment it, we'll DM you")}${s.cta.pill !== false && !/\s/.test(s.cta.keyword) ? ' <span class="pill">DM SENT</span>' : ''}</div></div>` : '';
  const hl = (s.headline || []).map((l) => `<div>${acc(l)}</div>`).join('');
  const card = s.card ? `<div class="card${s.card.accent ? ' acc' : ''}" style="top:${s.card.y ?? 470}px">${s.card.title ? `<div class="t">${esc(s.card.title)}</div>` : ''}${CARDS[s.card.kind](s.card)}</div>` : '';
  const notes = (s.notes || []).map((n) => `<div class="note${n.accent ? ' acc' : ''}" style="left:${n.x}px;top:${n.y}px;width:${n.w ?? 380}px">${esc(n.text).replace(/\n/g, '<br>')}${n.arrow ? arrow({ ...n.arrow, x1: n.arrow.x1 - n.x, y1: n.arrow.y1 - n.y, x2: n.arrow.x2 - n.x, y2: n.arrow.y2 - n.y }) : ''}</div>`).join('');
  const sprites = (s.sprites || []).map((p) => `<img class="sprite" src="../../assets/pixel/sprites/${p.name}.png" style="left:${p.x}px;height:${p.h}px;${p.y !== undefined ? `top:${p.y}px` : `bottom:${1350 - GRASS - (p.sink ?? 6)}px`};${p.flip ? 'transform:scaleX(-1)' : ''}">`).join('');
  document.getElementById('root').innerHTML = `
    <div class="canvas ${world}" style="${s.accent ? `--acc:${s.accent};` : ''}">
      <div class="sky" style="background-image:url(../../assets/pixel/sky-${world}.png)"></div>
      ${s.bgPhoto ? `<div class="bgph" style="background-image:url(${esc(s.bgPhoto)})"></div><div class="bgwash"></div>` : ''}
      ${s.brandbar ? `<div class="bbar">${s.brandbar.map((b, k) => `${k ? '<span class="plus">+</span>' : ''}<img src="${logoUrl(b)}">${s.brandbar.length === 1 ? esc((BRANDS[b] || {}).name || b) : ''}`).join('')}</div>` : ''}
      <div class="count">${i + 1}/${DATA.slides.length}</div>
      <div class="hl ${s.size || ''}${s.brandbar ? ' withbar' : ''}">${hl}${s.underline !== false && hl ? '<svg class="uline" viewBox="0 0 600 28" preserveAspectRatio="none"><path d="M6 18 C150 6, 420 6, 594 14"/><path d="M60 25 C220 16, 400 17, 520 22" style="stroke-width:4"/></svg>' : ''}</div>
      ${card}
      ${s.kw ? `<div class="kw" style="top:${s.kw.y ?? 520}px">${esc(s.kw.text)}</div>` : ''}
      ${s.hand ? `<div class="hand" style="top:${s.hand.y}px">${esc(s.hand.text)}</div>` : ''}
      ${s.tree ? treeHtml(s.tree) : ''}
      ${collage}${sprites}${igcta}${notes}${bursts}
      <div class="wmrow"><img src="../../assets/brand/lockup-horizontal.png" alt=""></div>
      <div class="foot"><span class="h">${DATA.platform === 'linkedin' ? ICONS.li : ICONS.ig}${esc(DATA.handle || '@contentsystems.ai')}</span><span class="h">save for later ${ICONS.bm}</span></div>
    </div>`;
  document.querySelectorAll('.hl > div').forEach((l) => { l.style.whiteSpace = 'nowrap'; let fs = parseFloat(getComputedStyle(l).fontSize); while (l.scrollWidth > 960 && fs > 60) { fs -= 4; l.style.fontSize = fs + 'px'; } });
};
</script>
</body>
</html>
