<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../_base/brand.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  /* Korede's personal-brand photo carousel (research/style-personal-carousel.md, ref @mr.pynk).
     1 photo per carousel: cutout of Korede on the cover (optionally over a swapped clean background),
     the same photo blurred and darkened behind every inner slide, crisp cards on top. 1080x1350.
     Type: Inter 600-700 tight (-0.05em) + Instrument Serif italic for accent words. No bursts, no stickers. */
  .canvas { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: var(--bgc, #0f1a13); --a: var(--acc, #E8B84B); --at: var(--acct, #17281C); --ad: #A8761B;
    font-family: 'Inter', sans-serif; color: #fff; }
  .ph { position: absolute; inset: 0; background-size: cover; background-repeat: no-repeat; }
  .ph.blur { inset: -80px; filter: blur(var(--bl, 26px)) brightness(var(--br, .55)) saturate(1.05); }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,12,10,var(--top, .6)) 0%, rgba(8,12,10,0) 40%, rgba(8,12,10,0) 62%, rgba(8,12,10,var(--bot, .7)) 100%); }
  .cut { position: absolute; z-index: 3; filter: drop-shadow(0 30px 50px rgba(0,0,0,.5)); }
  .k { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; color: var(--a); font-size: 1.1em; }
  .blocks { position: absolute; left: 70px; right: 70px; z-index: 5; text-align: center; }
  .blocks { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .blk { font: 700 var(--fs, 104px)/1.0 'Inter'; letter-spacing: -0.05em; padding: 14px 28px 20px; box-shadow: 0 14px 34px rgba(0,0,0,.35); white-space: nowrap; }
  .blk.acc { background: var(--a); color: var(--at); }
  .blk.acc .k { color: #fff; }
  .blk.white { background: #fff; color: #111; }
  .blk.white .k { color: #A8761B; }
  .blk.ink { background: #111; color: #fff; }
  .blk.bare { color: #fff; text-shadow: 0 4px 30px rgba(0,0,0,.45); box-shadow: none; padding: 0; }
  .blk:nth-child(2) { transform: translateX(var(--off, 30px)); }
  .pay { position: absolute; left: 110px; right: 110px; z-index: 6; background: #F7F3EA; border: 6px solid var(--a); padding: 28px 34px 32px; text-align: center; font: 700 50px/1.12 'Inter'; letter-spacing: -0.04em; color: #111; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .pay .k { color: #A8761B; }
  .pay u { text-decoration: none; background: linear-gradient(var(--a), var(--a)) 0 92% / 100% 8px no-repeat; }

  .label { position: absolute; left: 80px; z-index: 5; font: 700 28px/1 'Inter'; letter-spacing: 0.02em; text-transform: uppercase; background: var(--a); color: var(--at); padding: 14px 22px; }
  .title { position: absolute; left: 80px; right: 80px; z-index: 5; font: 700 var(--ts, 92px)/1.02 'Inter'; letter-spacing: -0.05em; color: #fff; }
  .body { position: absolute; left: 80px; right: 80px; z-index: 5; display: flex; flex-direction: column; gap: 26px; }
  .stat { display: flex; align-items: center; gap: 30px; }
  .stat b { font: 700 210px/0.9 'Inter'; letter-spacing: -0.06em; color: var(--a); }
  .stat span { font: 600 42px/1.18 'Inter'; letter-spacing: -0.03em; color: #fff; max-width: 9em; }
  .list { display: flex; flex-direction: column; gap: 16px; }
  .list .i { display: flex; gap: 24px; align-items: center; background: #F7F3EA; border-left: 10px solid var(--a); padding: 30px 32px; font: 600 40px/1.15 'Inter'; letter-spacing: -0.035em; color: #111; box-shadow: 0 14px 34px rgba(0,0,0,.28); }
  .list .i em { font: 700 30px/1 'Inter'; font-style: normal; width: 56px; height: 56px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--a); color: var(--at); letter-spacing: 0; }
  .list .i.off { background: rgba(250,247,240,.35); color: rgba(255,255,255,.75); text-decoration: line-through; text-decoration-thickness: 3px; }
  .list .i .k { color: #A8761B; }
  .frames { position: relative; height: var(--fh, 520px); }
  .frame { position: absolute; background: #fff; padding: 10px; box-shadow: 0 20px 44px rgba(0,0,0,.5); }
  .frame img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: var(--p, 50% 30%); }
  .ann { position: absolute; left: 80px; right: 80px; top: var(--ay, 1000px); z-index: 6; background: #F7F3EA; border: 5px solid var(--a); padding: 22px 28px; font: 600 32px/1.32 'Inter'; letter-spacing: -0.03em; color: #111; }
  .ann div + div { margin-top: 10px; }
  .ann b { color: #A8761B; font-weight: 700; }
  .prog { position: absolute; left: 0; bottom: 0; height: 10px; z-index: 8; background: var(--a); }
  .quote { position: absolute; left: 80px; right: 80px; z-index: 5; text-shadow: 0 4px 26px rgba(0,0,0,.55); font: 700 var(--qs, 84px)/1.04 'Inter'; letter-spacing: -0.05em; color: #fff; }
  .quote small { display: block; margin-top: 34px; font: 650 38px/1.35 'Inter'; letter-spacing: -0.02em; color: #fff; }
  /* readable on busy photos (Korede 2026-10-24): dark outline + glow on every quote line, brighter accent */
  .quote, .quote small { -webkit-text-stroke: 1.5px rgba(8,12,9,.55); paint-order: stroke fill; text-shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 18px rgba(0,0,0,.75), 0 0 42px rgba(0,0,0,.5); }
  .quote .k { filter: brightness(1.35) saturate(1.15); -webkit-text-stroke: 2px rgba(8,12,9,.7); }
  .text { font: 500 46px/1.3 'Inter'; letter-spacing: -0.03em; color: #fff; }
  .text p + p { margin-top: 26px; }
  .text mark { background: none; color: var(--a); font-weight: 700; }

  .foot { position: absolute; left: 56px; right: 56px; bottom: 40px; z-index: 7; display: flex; align-items: center; justify-content: space-between; color: rgba(255,255,255,.9); font: 600 28px/1 'Inter'; letter-spacing: -0.02em; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .foot .h { display: flex; align-items: center; gap: 12px; }
  .foot svg { width: 32px; height: 32px; stroke: currentColor; fill: none; stroke-width: 2; }
  .count { position: absolute; top: 40px; right: 56px; z-index: 7; font: 600 26px/1 'Inter'; color: rgba(255,255,255,.75); }
  .wm { position: absolute; left: 0; right: 0; bottom: 100px; z-index: 7; display: flex; justify-content: center; }
  .wm img { height: 112px; filter: brightness(1.3) contrast(1.2) saturate(1.15) drop-shadow(0 4px 14px rgba(0,0,0,.6)); }
  .swipe { position: absolute; right: 56px; bottom: 100px; z-index: 7; font: 600 28px/1 'Inter'; color: #fff; background: rgba(0,0,0,.4); padding: 14px 22px; border-radius: 40px; }

  /* themes (max 3 hues: ink base, white/cream, 1 accent). DATA.theme: gold | claude | blue | emerald | ink */
  .ph.front { z-index: 6; pointer-events: none; }
  .cut.front { z-index: 6; }
  .canvas .k { color: var(--a); }
  .blk.white .k, .pay .k, .list .i .k { color: var(--ad); }
  .ann b { color: var(--ad); }
  .pay { z-index: 7; }
  .news { position: absolute; left: 70px; z-index: 5; display: flex; align-items: center; gap: 0; font: 700 34px/1 'Inter'; letter-spacing: -0.01em; text-transform: uppercase; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
  .news b { background: #C8102E; color: #fff; padding: 14px 18px; }
  .news span { background: #fff; color: #111; padding: 14px 20px; }
  /* visual kinds for inner slides */
  .card { background: #F7F3EA; color: #111; padding: 28px 30px; box-shadow: 0 18px 40px rgba(0,0,0,.35); border-top: 10px solid var(--a); }
  .chat { display: flex; flex-direction: column; gap: 16px; }
  .chat .b { max-width: 78%; font: 600 34px/1.25 'Inter'; letter-spacing: -0.025em; padding: 18px 24px; border-radius: 28px; }
  .chat .b.me { align-self: flex-end; background: var(--a); color: var(--at); border-bottom-right-radius: 6px; }
  .chat .b.ai { align-self: flex-start; background: #fff; color: #111; border-bottom-left-radius: 6px; box-shadow: 0 2px 0 rgba(0,0,0,.08); }
  .chat .who { font: 700 22px/1 'Inter'; text-transform: uppercase; letter-spacing: .04em; color: rgba(0,0,0,.45); margin-bottom: 4px; }
  .flow { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .flow .st { flex: 1; text-align: center; background: #F7F3EA; color: #111; padding: 26px 14px; font: 700 34px/1.12 'Inter'; letter-spacing: -0.035em; box-shadow: 0 16px 34px rgba(0,0,0,.32); }
  .flow .st.hi { background: var(--a); color: var(--at); }
  .flow .ar { font: 700 44px/1 'Inter'; color: var(--a); }
  .logos { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
  .logos .lg { display: flex; align-items: center; gap: 14px; background: #fff; color: #111; padding: 16px 22px 16px 16px; font: 700 34px/1 'Inter'; letter-spacing: -0.03em; box-shadow: 0 12px 28px rgba(0,0,0,.3); }
  .logos .lg img { width: 52px; height: 52px; object-fit: contain; }
  .logos .lg.off { opacity: .45; text-decoration: line-through; text-decoration-thickness: 4px; }
  .logos .lg.hi { outline: 6px solid var(--a); }
  .sprites { display: flex; justify-content: center; align-items: flex-end; gap: 30px; border-bottom: 8px solid var(--a); padding: 0 20px; }
  .sprites img { image-rendering: pixelated; filter: drop-shadow(0 10px 16px rgba(0,0,0,.4)); }
  .approve .t { font: 700 26px/1 'Inter'; text-transform: uppercase; letter-spacing: .05em; color: rgba(0,0,0,.5); margin-bottom: 16px; }
  .approve .m { font: 700 44px/1.15 'Inter'; letter-spacing: -0.04em; }
  .approve .s { margin-top: 10px; font: 500 30px/1.3 'Inter'; color: rgba(0,0,0,.65); }
  .approve .btns { margin-top: 22px; display: flex; gap: 16px; }
  .approve .btns i { font-style: normal; flex: 1; text-align: center; padding: 18px; font: 700 32px/1 'Inter'; border: 4px solid #111; }
  .approve .btns i.y { background: var(--a); color: var(--at); border-color: var(--a); }
  .meme { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #111; padding: 8px; box-shadow: 0 18px 40px rgba(0,0,0,.4); }
  .meme .top { grid-column: 1 / 3; background: #fff; color: #111; font: 700 34px/1.2 'Inter'; letter-spacing: -0.03em; padding: 18px 22px; }
  .meme .pn { position: relative; height: 330px; padding-bottom: 58px; box-sizing: border-box; background: var(--pbg, #2b2f3a); display: grid; place-items: end center; overflow: hidden; }
  .meme .pn img { height: 250px; image-rendering: pixelated; }
  .meme .pn .cap { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font: 700 30px/1.15 'Inter'; color: #fff; text-shadow: 0 2px 0 #000, 0 0 10px #000; padding: 0 10px; }

  .prompt { background: #0F1311; color: #F2EFE8; box-shadow: 0 18px 40px rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.12); }
  .prompt .hd { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px; border-bottom: 2px solid rgba(255,255,255,.1); font: 600 24px/1 'Inter'; color: rgba(255,255,255,.6); letter-spacing: 0; }
  .prompt .hd b { background: var(--a); color: var(--at); font: 700 22px/1 'Inter'; padding: 9px 14px; letter-spacing: .04em; }
  .prompt pre { margin: 0; padding: 22px 24px 26px; font: 500 27px/1.42 'JetBrains Mono', monospace; white-space: pre-wrap; letter-spacing: -0.01em; }
  .prompt pre i { font-style: normal; color: var(--a); }
  .form .t { font: 700 26px/1 'Inter'; text-transform: uppercase; letter-spacing: .05em; color: rgba(0,0,0,.5); margin-bottom: 14px; }
  .form .r { display: flex; gap: 18px; align-items: baseline; padding: 16px 0; border-bottom: 3px dashed rgba(0,0,0,.18); font: 600 32px/1.2 'Inter'; letter-spacing: -0.03em; }
  .form .r:last-child { border-bottom: 0; }
  .form .r b { min-width: 7.2em; color: #111; }
  .form .r span { color: rgba(0,0,0,.55); font-family: 'Instrument Serif', serif; font-style: italic; font-size: 36px; font-weight: 400; }
  .locked { display: flex; flex-direction: column; gap: 14px; }
  .locked .i { position: relative; display: flex; gap: 22px; align-items: center; background: #F7F3EA; padding: 26px 30px; box-shadow: 0 14px 34px rgba(0,0,0,.28); font: 600 38px/1.15 'Inter'; letter-spacing: -0.035em; color: #111; overflow: hidden; }
  .locked .i span { filter: blur(var(--lb, 0px)); }
  .locked .i em { font: 700 28px/1 'Inter'; font-style: normal; width: 52px; height: 52px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--ad); color: #fff; }
  .chat mark { background: color-mix(in srgb, var(--a) 45%, white); color: #111; padding: 0 4px; }
  .locked .i small { margin-left: auto; flex: none; font: 700 22px/1 'Inter'; text-transform: uppercase; letter-spacing: .05em; background: #111; color: #fff; padding: 10px 14px; display: flex; gap: 8px; align-items: center; }
  .locked .i small svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2.4; }

  /* fill the body box (Korede: no half-empty slides): visuals scale with --vs, set by fitBody() */
  .body.fill { justify-content: center; gap: calc(26px * var(--vs, 1)); --vs: 1; }
  .body.fill .prompt pre { font-size: calc(27px * var(--vs)); }
  .body.fill .prompt .hd { font-size: calc(24px * var(--vs)); }
  .body.fill .form .r { font-size: calc(32px * var(--vs)); padding: calc(16px * var(--vs)) 0; }
  .body.fill .form .r span { font-size: calc(36px * var(--vs)); }
  .body.fill .form .t, .body.fill .approve .t { font-size: calc(26px * var(--vs)); }
  .body.fill .card { padding: calc(28px * var(--vs)) calc(30px * var(--vs)); }
  .body.fill .chat .b { font-size: calc(34px * var(--vs)); }
  .body.fill .flow .st { font-size: calc(34px * var(--vs)); padding: calc(26px * var(--vs)) 14px; }
  .body.fill .locked .i, .body.fill .list .i { font-size: calc(38px * var(--vs)); padding: calc(26px * var(--vs)) 30px; }
  .body.fill .approve .m { font-size: calc(44px * var(--vs)); }
  .body.fill .approve .s { font-size: calc(30px * var(--vs)); }
  .body.fill .approve .btns i { font-size: calc(32px * var(--vs)); padding: calc(18px * var(--vs)); }
  .body.fill .logos .lg { font-size: calc(34px * var(--vs)); padding: calc(16px * var(--vs)) 22px calc(16px * var(--vs)) 16px; }
  .body.fill .logos .lg img { width: calc(52px * var(--vs)); height: calc(52px * var(--vs)); }
  .body.fill .stat b { font-size: calc(210px * var(--vs)); }
  .body.fill .stat span { font-size: calc(42px * var(--vs)); }
  .body.fill .sprites img { height: calc(var(--sh) * var(--vs)) !important; }
  .body.fill .meme .pn { height: calc(330px * var(--vs)); }
  .body.fill .meme .pn img { height: calc(250px * var(--vs)); }
  .body.fill .meme .top { font-size: calc(34px * var(--vs)); }
</style>
</head>
<body>
<div id="root"></div>
<script>
// data: { handle, platform: instagram|linkedin, accent, slides: [ {
//   kind: cover|body|quote|text|cta,
//   photo: { src (repo path), pos "50% 30%", size "cover", blur: true, dim: {top, bot} }, bgc,
//   cut: { src, x, y, h, flip },
//   blocks: [{ text ("*k*" = accent word), style: acc|white|ink|bare, size }], blocksY, off,
//   pay: { text ("_u_" underline), y }, label, title, titleY, bodyY,
//   stat: { value, label }, list: [{ n, text, off }], frames: [{ src, x, y, w, h, rot, pos }], fh, ann: [{ k, v }],
//   quote: { text, sub, y }, text: [para], swipe, wordmark } ] }
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (s) => esc(s).replace(/\*(.+?)\*/g, '<span class="k">$1</span>').replace(/_(.+?)_/g, '<u>$1</u>').replace(/\[(.+?)\]/g, '<mark>$1</mark>').replace(/\n/g, '<br>');
const R = (p) => /^(https?|file|data):/.test(p) ? p : `../../${p}`;
const ICONS = {
  ig: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>',
  li: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/></svg>',
  bm: '<svg viewBox="0 0 24 24" style="fill:currentColor"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
};

const THEMES = {
  gold: { acc: '#E8B84B', at: '#17281C', ad: '#A8761B' },
  claude: { acc: '#E07A55', at: '#1A0E08', ad: '#C2552E' },
  emerald: { acc: '#2FCB7A', at: '#0B1F14', ad: '#16935A' },
  ink: { acc: '#F5F0E8', at: '#111111', ad: '#111111' },
};
const logoSrc = (id) => `../../assets/logos/${((DATA.brandsCfg || {})[id] || {}).logo || id + '.svg'}`;
const logoName = (id) => ((DATA.brandsCfg || {})[id] || {}).name || id;
const VIS = {

  prompt: (c) => `<div class="prompt"><div class="hd">${esc(c.label || 'Paste into Claude or ChatGPT')}<b>COPY THIS</b></div><pre>${esc(c.text).replace(/\[(.+?)\]/g, '<i>[$1]</i>')}</pre></div>`,
  form: (c) => `<div class="card form">${c.title ? `<div class="t">${esc(c.title)}</div>` : ''}${c.rows.map((r) => `<div class="r"><b>${esc(r.k)}</b><span>${esc(r.v || '')}</span></div>`).join('')}</div>`,
  locked: (c) => `<div class="locked">${c.map((it) => `<div class="i" style="${it.blur ? `--lb:${it.blur}px` : ''}">${it.n !== undefined ? `<em>${esc(it.n)}</em>` : ''}<span>${fmt(it.text)}</span><small><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>${esc(it.tag || 'In the PDF')}</small></div>`).join('')}</div>`,
  chat: (c) => `<div class="card chat">${c.map((m) => `<div class="b ${m.who === 'me' ? 'me' : 'ai'}">${m.who !== 'me' && m.label ? `<div class="who">${esc(m.label)}</div>` : ''}${fmt(m.text)}</div>`).join('')}</div>`,
  flow: (c) => `<div class="flow">${c.map((t, k) => `${k ? '<span class="ar">&rarr;</span>' : ''}<div class="st${typeof t === 'object' && t.hi ? ' hi' : ''}">${fmt(typeof t === 'object' ? t.text : t)}</div>`).join('')}</div>`,
  logos: (c) => `<div class="logos">${c.map((l) => { const o = typeof l === 'object' ? l : { id: l }; return `<div class="lg${o.off ? ' off' : ''}${o.hi ? ' hi' : ''}"><img src="${logoSrc(o.id)}">${esc(o.name || logoName(o.id))}</div>`; }).join('')}</div>`,
  sprites: (c) => `<div class="sprites">${c.map((p) => `<img src="../../assets/pixel/sprites/${p.name}.png" style="--sh:${p.h ?? 240}px;height:${p.h ?? 240}px;${p.flip ? 'transform:scaleX(-1)' : ''}">`).join('')}</div>`,
  approve: (c) => `<div class="card approve"><div class="t">${esc(c.title || 'Waiting for your yes')}</div><div class="m">${fmt(c.main)}</div>${c.sub ? `<div class="s">${fmt(c.sub)}</div>` : ''}<div class="btns"><i class="y">${esc(c.yes || 'Approve')}</i><i>${esc(c.no || 'Edit')}</i></div></div>`,
  meme: (c) => `<div class="meme"><div class="top">${fmt(c.top)}</div>${c.panels.map((p) => `<div class="pn" style="--pbg:${p.bg || '#2b2f3a'}"><img src="../../assets/pixel/sprites/${p.sprite}.png" style="${p.h ? `height:${p.h}px;` : ''}${p.flip ? 'transform:scaleX(-1)' : ''}">${p.cap ? `<div class="cap">${esc(p.cap)}</div>` : ''}</div>`).join('')}</div>`,
};
let DATA;
window.renderPost = (data) => { DATA = data; window.slideCount = data.slides.length; window.showSlide(0); };
window.showSlide = (i) => {
  const s = DATA.slides[i], TH = THEMES[s.theme || DATA.theme] || THEMES.gold, A = s.accent || (DATA.theme ? TH.acc : DATA.accent) || TH.acc;
  const ph = s.photo ? `<div class="ph${s.photo.blur ? ' blur' : ''}" style="background-image:url('${R(s.photo.src)}');background-position:${s.photo.pos || '50% 30%'};background-size:${s.photo.size || 'cover'};${s.photo.blur && s.photo.blur !== true ? `--bl:${s.photo.blur}px` : ''}${s.photo.bright ? `;--br:${s.photo.bright}` : ''}"></div><div class="shade" style="--top:${s.photo.dim?.top ?? .55};--bot:${s.photo.dim?.bot ?? .7}"></div>` : '';
  const shadeG = s.photo ? `linear-gradient(180deg, rgba(8,12,10,${s.photo.dim?.top ?? .55}) 0%, rgba(8,12,10,0) 40%, rgba(8,12,10,0) 62%, rgba(8,12,10,${s.photo.dim?.bot ?? .7}) 100%)` : '';
  const front = s.photo && s.photo.front ? `<div class="ph front" style="background-image:${shadeG},url('${R(s.photo.src)}');background-size:100% 100%,${s.photo.size || 'cover'};background-position:0 0,${s.photo.pos || '50% 30%'};-webkit-mask-image:url('${s.photo.frontUrl || R(s.photo.front)}');-webkit-mask-size:${s.photo.size || 'cover'};-webkit-mask-position:${s.photo.pos || '50% 30%'};-webkit-mask-repeat:no-repeat"></div>` : '';
  const cut = s.cut ? `<img class="cut${s.cut.front ? ' front' : ''}" src="${R(s.cut.src)}" style="left:${s.cut.x}px;top:${s.cut.y}px;height:${s.cut.h}px;${s.cut.flip ? 'transform:scaleX(-1)' : ''}">` : '';
  const blocks = s.blocks ? `<div class="blocks" style="top:${s.blocksY ?? 110}px;--off:${s.off ?? 30}px">${s.blocks.map((b) => `<div class="blk ${b.style || 'acc'}" style="${b.size ? `--fs:${b.size}px` : ''}">${fmt(b.text)}</div>`).join('')}</div>` : '';
  const pay = s.pay ? `<div class="pay" style="top:${s.pay.y ?? 930}px;${s.pay.size ? `font-size:${s.pay.size}px` : ''}">${fmt(s.pay.text)}</div>` : '';
  const label = s.label ? `<div class="label" style="top:${s.labelY ?? 120}px">${esc(s.label)}</div>` : '';
  const title = s.title ? `<div class="title" style="top:${s.titleY ?? 210}px;${s.titleSize ? `--ts:${s.titleSize}px` : ''}">${fmt(s.title)}</div>` : '';
  let body = '';
  if (s.stat) body += `<div class="stat"><b>${esc(s.stat.value)}</b><span>${esc(s.stat.label)}</span></div>`;
  if (s.list) body += `<div class="list">${s.list.map((it) => `<div class="i${it.off ? ' off' : ''}">${it.n !== undefined ? `<em>${esc(it.n)}</em>` : ''}<span>${fmt(it.text)}</span></div>`).join('')}</div>`;
  if (s.frames) body += `<div class="frames" style="--fh:${s.fh ?? 520}px">${s.frames.map((f) => `<div class="frame" data-fi="${s.frames.indexOf(f)}" style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px;transform:rotate(${f.rot ?? 0}deg);--p:${f.pos || '50% 30%'}"><img src="${R(f.src)}"></div>`).join('')}</div>`;
  Object.keys(VIS).forEach((k) => { if (s[k]) body += VIS[k](s[k]); });
  if (s.text) body += `<div class="text">${s.text.map((p) => `<p>${fmt(p)}</p>`).join('')}</div>`;
  const annEl = s.ann ? `<div class="ann" style="--ay:${s.annY ?? 1010}px">${s.ann.map((a) => `<div><b>${esc(a.k)}:</b> ${esc(a.v)}</div>`).join('')}</div>` : '';
  const bodyBottom = s.ann ? (s.annY ?? 1010) - 36 : (s.pay ? (s.pay.y ?? 930) - 36 : 1230);
  const bodyEl = body ? `<div class="body fill" style="top:${s.bodyY ?? 470}px;height:${bodyBottom - (s.bodyY ?? 470)}px">${body}</div>` : '';
  const quote = s.quote ? `<div class="quote" style="top:${s.quote.y ?? 160}px;${s.quote.size ? `--qs:${s.quote.size}px` : ''}">${esc(s.quote.text).replace(/\*([\s\S]+?)\*/g, '<span class=\"k\">$1</span>').replace(/\n/g, '<br>')}${s.quote.sub ? `<small>${esc(s.quote.sub).replace(/\n/g, '<br>')}</small>` : ''}</div>` : '';
  document.getElementById('root').innerHTML = `
    <div class="canvas" style="--acc:${A};--acct:${s.accentText || (DATA.theme ? TH.at : DATA.accentText) || TH.at};--ad:${TH.ad};${s.bgc ? `--bgc:${s.bgc}` : ''}">
      ${ph}${cut}${blocks}${front}${s.news ? `<div class="news" style="top:${s.news.y ?? 60}px"><b>${esc(s.news.tag)}</b><span>${esc(s.news.text)}</span></div>` : ''}${label}${title}${bodyEl}${annEl}${quote}${pay}<div class="prog" style="width:${((i + 1) / DATA.slides.length) * 100}%"></div>
      <div class="count">${i + 1}/${DATA.slides.length}</div>
      ${s.swipe ? `<div class="swipe">${esc(s.swipe)} &rarr;</div>` : ''}
      ${s.wordmark ? `<div class="wm"${s.wmTop ? ` style="top:${s.wmTop}px;bottom:auto"` : ''}>` + '<img src="../../assets/brand/lockup-horizontal.png" alt=""></div>' : ''}
      <div class="foot"><span class="h">${DATA.platform === 'linkedin' ? ICONS.li : ICONS.ig}${esc(DATA.handle || '@koredekola')}</span><span class="h">save for later ${ICONS.bm}</span></div>
    </div>`;
  fitBody();
};
// grow the visuals until the body box is full (max 1.6x), never overflow it
function fitBody() {
  // the note box never runs into the footer: lift it, and shrink the body box to match
  const ann = document.querySelector('.ann'), b0 = document.querySelector('.body.fill');
  if (ann && ann.offsetTop + ann.offsetHeight > 1236) {
    const top = 1236 - ann.offsetHeight; ann.style.top = top + 'px';
    if (b0) b0.style.height = Math.max(200, top - 36 - b0.offsetTop) + 'px';
  }
  const b = b0; if (!b || b.querySelector('.frames')) return;
  const avail = b.clientHeight, used = () => [...b.children].reduce((h, c) => h + c.offsetHeight, 0) + (b.children.length - 1) * 26 * (+b.style.getPropertyValue('--vs') || 1);
  let vs = 1;
  while (vs < 1.6) { b.style.setProperty('--vs', (vs + 0.05).toFixed(2)); if (used() > avail * 0.94 || b.scrollWidth > b.clientWidth + 2) { b.style.setProperty('--vs', vs.toFixed(2)); break; } vs += 0.05; }
}
</script>
