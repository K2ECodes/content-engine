<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../_base/brand.css">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=block" rel="stylesheet">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<style>
  /* Arena reel: a pixel fighting-game explainer in the brand's 8-bit world (research/style-fire-reel.md). 1080x1920, locked camera. */
  :root { --boss: #C9503C; --cap: #0A120D; }
  .canvas { width: 1080px; height: 1920px; font-family: 'Silkscreen', monospace; color: var(--cream); background: #041036; }
  .px, .canvas img { image-rendering: pixelated; }
  .sky { position: absolute; inset: 0; background: url(../../assets/pixel/arena-night.png) 0 0 / 1080px 1920px no-repeat; image-rendering: pixelated; }
  .tint { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 620px 760px at 800px 1060px, rgba(201,80,60,.55), rgba(201,80,60,.12) 60%, rgba(60,10,10,.35)); mix-blend-mode: screen; }
  .tint2 { position: absolute; inset: 0; opacity: 0; background: rgba(90,20,20,.28); mix-blend-mode: multiply; }
  .ring { position: absolute; left: 90px; width: 900px; height: 110px; top: 1250px; border: 3px dashed rgba(245,240,232,.18); border-radius: 450px / 55px; }
  .lamp { position: absolute; top: 1206px; width: 14px; height: 14px; background: var(--gold); box-shadow: 0 0 24px 8px rgba(232,184,75,.35); }

  /* HUD */
  .hud { position: absolute; left: 40px; right: 40px; top: 150px; height: 150px; z-index: 8; }
  .hud .panel { position: absolute; inset: 0; background: rgba(23,40,28,.88); border: 4px solid var(--cream); box-shadow: 8px 8px 0 rgba(0,0,0,.55); }
  .bar { position: absolute; top: 26px; height: 34px; width: 410px; background: #0A120D; border: 4px solid rgba(245,240,232,.9); }
  .bar.p { left: 24px; } .bar.e { right: 24px; }
  .bar i { position: absolute; inset: 0; transform-origin: left; }
  .bar.e i { transform-origin: right; }
  .bar i.ghost { background: var(--cream); }
  .bar.p i.fill { background: var(--gold); box-shadow: inset 0 -8px 0 rgba(0,0,0,.18); }
  .bar.e i.fill { background: var(--orange); box-shadow: inset 0 -8px 0 rgba(0,0,0,.18); }
  .hud .rnd { position: absolute; left: 50%; top: 18px; width: 120px; margin-left: -60px; text-align: center; font: 700 22px/1 'Silkscreen'; color: var(--gold); }
  .hud .rnd b { display: block; margin-top: 6px; font-size: 36px; color: var(--cream); }
  .hud .nm { position: absolute; top: 80px; font: 700 28px/1 'Silkscreen'; white-space: nowrap; }
  .hud .nm.p { left: 24px; color: var(--sage); }
  .hud .nm.e { right: 24px; color: var(--cream); text-align: right; }
  .hud .cnt { position: absolute; right: 24px; top: 116px; font: 700 26px/1 'Silkscreen'; color: var(--gold); white-space: nowrap; }
  .hud .cnt span { display: inline-block; }
  .hud .cl { position: absolute; left: 24px; top: 116px; font: 400 20px/1 'Silkscreen'; color: rgba(245,240,232,.55); }

  /* Fighters */
  .actor { position: absolute; z-index: 4; }
  .actor img { position: absolute; bottom: 0; }
  .shadow { position: absolute; height: 22px; border-radius: 50%; background: rgba(0,0,0,.4); z-index: 3; }
  .enemy { position: absolute; z-index: 4; }
  .enemy .body { position: absolute; inset: 0; }
  .enemy .body img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .enemy .eyes { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 34px; }
  .enemy .eyes i { width: 30px; height: 30px; background: #0A120D; position: relative; box-shadow: inset -10px -10px 0 #0A120D, inset 10px 10px 0 #fff; }
  .enemy .eyes i::before { content: ''; position: absolute; top: -18px; left: -6px; width: 42px; height: 10px; background: #0A120D; transform: rotate(18deg); }
  .enemy .eyes i:last-child::before { transform: rotate(-18deg); }
  .enemy.boss .eyes { left: 30px; right: 30px; gap: 70px; padding: 22px 0 18px; background: #160606; border: 4px solid #0A120D; }
  .enemy.boss .eyes i { width: 46px; height: 34px; background: #ff4a3c; box-shadow: 0 0 26px 10px rgba(255,74,60,.75); }
  .enemy.boss .eyes i::before { display: none; }
  .enemy .plate { position: absolute; left: 50%; bottom: calc(100% + 26px); transform: translateX(-50%); white-space: nowrap; font: 700 30px/1 'Silkscreen'; color: var(--cream); background: rgba(10,18,13,.92); border: 3px solid var(--orange); padding: 10px 14px 8px; }
  .wall { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .wall img { position: static !important; width: 100% !important; height: 100% !important; }
  .piece { position: absolute; z-index: 5; opacity: 0; background-repeat: repeat; image-rendering: pixelated; }
  .ghostimg { position: absolute; z-index: 3; opacity: 0; filter: brightness(1.7) sepia(1) hue-rotate(-10deg) saturate(3); }

  /* FX */
  .spark { position: absolute; width: 200px; height: 200px; margin: -100px 0 0 -100px; z-index: 7; opacity: 0; }
  .ko { position: absolute; z-index: 9; font: 700 110px/1 'Silkscreen'; color: var(--gold); text-shadow: 6px 6px 0 #0A120D, -3px -3px 0 #0A120D, 3px -3px 0 #0A120D, -3px 3px 0 #0A120D; opacity: 0; white-space: nowrap; }
  .coinpop { position: absolute; z-index: 7; width: 70px; opacity: 0; }
  .flash { position: absolute; inset: 0; background: var(--cream); opacity: 0; z-index: 20; pointer-events: none; }
  .orb { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 0; background: var(--gold); box-shadow: 0 0 30px 14px rgba(232,184,75,.65); z-index: 7; opacity: 0; }
  .orb.big { width: 110px; height: 110px; margin: -55px 0 0 -55px; background: var(--cream); box-shadow: 0 0 50px 24px rgba(232,184,75,.8), 0 0 0 10px var(--gold); }
  .pring { position: absolute; border: 6px solid var(--gold); border-radius: 50%; z-index: 3; opacity: 0; }
  .beam { position: absolute; height: 140px; right: 0; z-index: 6; transform-origin: left center; transform: scaleX(0); opacity: 0;
          background: linear-gradient(180deg, var(--orange) 0%, #F3D88A 22%, var(--cream) 40%, var(--cream) 60%, #F3D88A 78%, var(--orange) 100%);
          box-shadow: 0 0 50px 16px rgba(232,184,75,.6); display: flex; align-items: center; padding-left: 40px; font: 700 50px/1 'Silkscreen'; color: var(--ink); white-space: nowrap; }
  .ret { position: absolute; z-index: 8; opacity: 0; }
  .ret i { position: absolute; width: 56px; height: 56px; border: 0 solid var(--gold); }
  .ret i:nth-child(1) { left: 0; top: 0; border-width: 8px 0 0 8px; }
  .ret i:nth-child(2) { right: 0; top: 0; border-width: 8px 8px 0 0; }
  .ret i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 8px 8px; }
  .ret i:nth-child(4) { right: 0; bottom: 0; border-width: 0 8px 8px 0; }
  .ret b { position: absolute; left: 50%; top: -60px; transform: translateX(-50%); white-space: nowrap; font: 700 34px/1 'Silkscreen'; color: var(--gold); text-shadow: 4px 4px 0 #0A120D; }
  .scan { position: absolute; height: 8px; background: #ff6a4c; box-shadow: 0 0 20px 6px rgba(255,90,60,.7); z-index: 8; opacity: 0; }
  .weak { position: absolute; z-index: 9; background: var(--boss); color: var(--cream); font: 700 30px/1.15 'Silkscreen'; padding: 12px 16px 10px; border: 4px solid var(--cream); box-shadow: 6px 6px 0 #0A120D; opacity: 0; white-space: nowrap; }

  /* Cards and popups */
  .title { position: absolute; left: 0; right: 0; top: 380px; text-align: center; z-index: 9; opacity: 0; }
  .title h1 { font: 700 128px/1 'Silkscreen'; color: var(--cream); text-shadow: 8px 8px 0 #0A120D, -4px -4px 0 #0A120D, 4px -4px 0 #0A120D, -4px 4px 0 #0A120D; }
  .title h2 { margin-top: 26px; font: 700 66px/1 'Silkscreen'; color: var(--orange); text-shadow: 5px 5px 0 #0A120D; opacity: 0; }
  .title.boss h1 { color: #FF7A5C; }
  .pop { position: absolute; left: 140px; right: 140px; z-index: 9; background: rgba(10,18,13,.94); border: 5px solid var(--gold); box-shadow: 8px 8px 0 rgba(0,0,0,.6); text-align: center; padding: 18px 20px 20px; opacity: 0; transform-origin: center top; }
  .pop.bad { border-color: var(--orange); }
  .pop small { display: block; font: 700 26px/1 'Silkscreen'; letter-spacing: .25em; color: var(--orange); }
  .pop.good small { color: var(--sage); }
  .pop .typed { display: block; margin-top: 14px; min-height: 64px; font: 700 64px/1 'Silkscreen'; color: var(--cream); }
  .pop.bad .typed { color: var(--orange); }

  .win { position: absolute; left: 0; right: 0; top: 380px; z-index: 9; text-align: center; opacity: 0; }
  .win h1 { display: inline-block; font: 700 150px/1 'Silkscreen'; color: var(--gold); transform: rotate(-6deg); text-shadow: 8px 8px 0 #0A120D, -4px -4px 0 #0A120D, 4px -4px 0 #0A120D, -4px 4px 0 #0A120D; }
  .wcard { position: absolute; left: 110px; right: 110px; top: 610px; z-index: 9; background: rgba(23,40,28,.95); border: 5px solid var(--gold); box-shadow: 10px 10px 0 rgba(0,0,0,.6); padding: 30px 34px 26px; opacity: 0; }
  .wcard .ln { font: 700 40px/1.35 'Silkscreen'; color: var(--cream); min-height: 1.35em; }
  .wcard .ln::before { content: '> '; color: var(--sage); }
  .wcard .ln:first-child { color: var(--gold); }
  .wcard .wm { display: flex; align-items: center; justify-content: space-between; margin: 22px -34px -26px; padding: 16px 34px; background: var(--cream); }
  .wcard .wm img { height: 30px; }
  .wcard .wm span { font: 400 18px/1 'Silkscreen'; color: rgba(23,40,28,.6); }

  .cont { position: absolute; left: 0; right: 0; top: 360px; z-index: 9; text-align: center; opacity: 0; }
  .cont h1 { font: 700 112px/1 'Silkscreen'; color: var(--cream); text-shadow: 8px 8px 0 #0A120D; }
  .cont .dig { display: inline-block; margin-top: 18px; font: 700 210px/1 'Silkscreen'; color: var(--gold); text-shadow: 10px 10px 0 #0A120D; }
  .cbox { position: absolute; left: 110px; right: 110px; top: 700px; z-index: 9; display: flex; align-items: center; gap: 22px; background: var(--cream); color: var(--ink); border: 6px solid var(--gold); box-shadow: 10px 10px 0 rgba(0,0,0,.6); padding: 22px 26px; font: 700 52px/1 'Silkscreen'; opacity: 0; }
  .cbox .av { width: 64px; height: 64px; flex: none; background: url(../../assets/brand/mark.png) center / 70% no-repeat, var(--ink); }
  .cbox .typed { flex: 1; }
  .cbox .typed:empty::before { content: attr(data-ph); color: rgba(23,40,28,.4); font-size: 34px; }
  .cbox .typed::after { content: '_'; color: var(--orange); }
  .cbox .post { font-size: 30px; color: var(--orange); }
  .dm { position: absolute; left: 50%; top: 850px; transform: translateX(-50%); z-index: 9; white-space: nowrap; background: var(--sage); color: var(--ink); font: 700 34px/1 'Silkscreen'; padding: 18px 26px 16px; border: 4px solid var(--ink); box-shadow: 6px 6px 0 rgba(0,0,0,.6); opacity: 0; }
  .cwm { position: absolute; left: 0; right: 0; top: 1560px; z-index: 9; text-align: center; opacity: 0; }
  .cwm img { height: 70px; padding: 14px 22px; background: var(--cream); border: 4px solid var(--ink); box-shadow: 6px 6px 0 rgba(0,0,0,.5); }

  /* Captions: sliding 3-word window */
  .caps { position: absolute; left: 0; right: 0; top: 1400px; text-align: center; z-index: 12; }
  .caps span { display: inline-block; background: var(--cap); padding: 16px 22px 12px; font: 700 50px/1 'Silkscreen'; text-transform: uppercase; letter-spacing: .03em; color: #fff; box-shadow: 6px 6px 0 rgba(0,0,0,.45); }
  .caps span:empty { display: none; }
  .caps b { color: var(--gold); font-weight: 700; }

  /* Brand mode: logo fighters (player/opponent/enemy `brand`), cut-paper stop motion, crowd, rain, stamps */
  .glow { position: absolute; inset: 0; opacity: .55; mix-blend-mode: screen; pointer-events: none; }
  .hud .nm .ic { display: inline-block; width: 30px; height: 30px; margin: -4px 10px 0 0; vertical-align: middle; background: #fff center / 70% no-repeat; border: 3px solid currentColor; }
  .hud .nm.e .ic { margin: -4px 0 0 10px; }
  .fighter { position: absolute; z-index: 4; }
  .paper, .pp { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .tile { position: absolute; left: 0; top: 0; box-sizing: border-box; border: 8px solid #FFFDF6; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .tile img { position: static !important; object-fit: contain; image-rendering: auto; }
  .teyes { position: absolute; left: 0; right: 0; top: 9%; display: flex; justify-content: center; gap: 20%; }
  .teyes i { position: relative; width: 13%; aspect-ratio: 1; background: #fff; border: 3px solid #0A120D; box-shadow: inset -9px -7px 0 #0A120D; }
  .teyes i::before { content: ''; position: absolute; left: -20%; top: -45%; width: 140%; height: 26%; background: #0A120D; transform: rotate(20deg); }
  .teyes i:last-child::before { transform: rotate(-20deg); }
  .glove { position: absolute; width: 74px; height: 64px; border: 5px solid #0A120D; box-shadow: inset -10px -10px 0 rgba(0,0,0,.28), inset 6px 6px 0 rgba(255,255,255,.35); z-index: 2; }
  .leg { position: absolute; width: 34px; height: 54px; background: #0A120D; }
  .leg::after { content: ''; position: absolute; bottom: 0; left: -8px; width: 50px; height: 14px; background: #0A120D; }
  .ghosttile { filter: none !important; }
  .bplate { position: absolute; left: 50%; bottom: calc(100% + 22px); transform: translateX(-50%); white-space: nowrap; font: 700 30px/1 'Silkscreen'; color: #fff; background: rgba(10,10,14,.92); border: 4px solid; padding: 10px 14px 8px; box-shadow: 5px 5px 0 rgba(0,0,0,.5); }
  .prize { position: absolute; z-index: 5; width: 150px; }
  .prize .ring { position: absolute; left: -14px; top: -14px; width: 178px; height: 178px; border: 8px solid; box-shadow: 0 0 34px 8px rgba(255,255,255,.25); }
  .prize .plab { position: absolute; left: 50%; top: 176px; transform: translateX(-50%); white-space: nowrap; font: 700 26px/1 'Silkscreen'; color: #fff; background: rgba(10,10,14,.92); border: 4px solid var(--gold); padding: 8px 12px 6px; }
  .prize .plab span { display: none; }
  .crown { position: absolute; left: 50%; top: -64px; margin-left: -40px; width: 80px; height: 44px; background: var(--gold); clip-path: polygon(0 100%, 0 20%, 25% 60%, 50% 0, 75% 60%, 100% 20%, 100% 100%); }
  .fan { position: absolute; z-index: 6; }
  .rain, .proj, .ally { position: absolute; z-index: 3; opacity: 0; }
  .proj { z-index: 7; }
  .stamp { position: absolute; z-index: 10; opacity: 0; white-space: nowrap; font: 700 78px/1 'Silkscreen'; padding: 16px 26px 10px; background: rgba(10,10,14,.94); border: 8px solid; box-shadow: 10px 10px 0 rgba(0,0,0,.6); text-shadow: 4px 4px 0 #000; }
  .stamp.sm { font-size: 40px; padding: 10px 16px 6px; border-width: 5px; }
  .combo { position: absolute; right: 60px; top: 330px; z-index: 10; opacity: 0; font: 700 64px/1 'Silkscreen'; color: var(--gold); text-shadow: 6px 6px 0 #0A120D, -3px -3px 0 #0A120D; white-space: nowrap; }
  .combo small { display: block; font-size: 30px; color: #fff; text-align: right; }
  .shield { position: absolute; z-index: 6; opacity: 0; border: 12px solid; box-shadow: 0 0 40px 10px currentColor, inset 0 0 40px 6px currentColor; }
  .bub { position: absolute; z-index: 11; opacity: 0; white-space: nowrap; font: 700 36px/1 'Silkscreen'; color: #0A120D; background: #fff; border: 4px solid #0A120D; padding: 10px 14px 6px; box-shadow: 5px 5px 0 rgba(0,0,0,.5); }
  .wlogo { display: flex; align-items: center; gap: 14px; font: 700 30px/1 'Silkscreen'; color: var(--ink); }
  .wlogo .tile { position: relative; border-width: 4px; }
  /* strict palette (brand mode): dark world, only the fighters' colours carry hue; other logos turn white-on-ink */
  .canvas.bm .sky { filter: saturate(.18) brightness(.5) contrast(1.15); }
  .canvas.bm .lamp { background: #F5F0E8; box-shadow: 0 0 18px 6px rgba(245,240,232,.18); }
  .canvas.bm .pop { border-color: #F5F0E8; }
  .canvas.bm .pop small, .canvas.bm .pop.good small { color: rgba(245,240,232,.7); }
  .canvas.bm .pop.bad { border-color: var(--bad, #F5F0E8); }
  .canvas.bm .pop.bad .typed { color: var(--bad, #F5F0E8); }
  .tile.mono { background: #17171F !important; }
  .canvas.bm .proj img { filter: grayscale(1) brightness(1.25) contrast(1.1); }
  .tile.mono img { filter: brightness(0) invert(1); }
  .gun { position: absolute; width: 104px; height: 34px; background: #2B2B36; border: 5px solid #0A120D; opacity: 0; z-index: 3; box-shadow: inset 0 -8px 0 rgba(0,0,0,.35); }
  .gun::before { content: ''; position: absolute; right: -36px; top: 3px; width: 30px; height: 14px; background: #4A4A5A; border: 4px solid #0A120D; }
  .gun::after { content: ''; position: absolute; left: 16px; top: 24px; width: 20px; height: 30px; background: #2B2B36; border: 4px solid #0A120D; }
  .gun b { position: absolute; left: 8px; top: 5px; width: 62px; height: 8px; }
  .bolt { position: absolute; z-index: 7; width: 54px; height: 16px; opacity: 0; border: 3px solid #fff; }
  .rocket { position: absolute; z-index: 7; width: 130px; height: 46px; opacity: 0; }
  .rocket i { position: absolute; }
  .mflash { position: absolute; z-index: 8; width: 90px; height: 90px; margin: -45px 0 0 -45px; opacity: 0; }
  .handle { display: inline-block; font: 700 40px/1 'Silkscreen'; color: #fff; background: rgba(10,10,14,.9); border: 4px solid #fff; padding: 14px 22px 10px; box-shadow: 6px 6px 0 rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* data (anchors resolved to seconds by scripts/render.mjs, see .claude/skills/arena-reel/SKILL.md):
{
  duration, words: [{w, start, end}],
  player: { name: 'KOREDE', sprite: 'korede' | 'sanjana' },
  counter: { label: 'RECOVERED', prefix: '$', suffix: '' },        // live HUD counter, ticks on each KO's `add`
  foot: 'Illustrative numbers',                                     // small HUD note, optional
  beats: [                                                          // every `at` / `xxxAt` is a spoken word, resolved to `t` / `xxxT`
    { type: 'round', t, title: 'ROUND 1', sub: 'FIGHT', enemy: { name, sprite: 'box'|'brick'|'qblock'|'bubble'|..., eyes: true },
      dashT?, hitT?, koT, add?: 3100, flash?: true },              // dash + afterimages, hit (white flash, hit-stop, spark), KO (silhouette, shatter, shake)
    { type: 'popup', t, title: 'WORK DONE', text: '$250K', kind: 'good'|'bad', slot: 0|1, outT? },   // unlock box, text types on the word
    { type: 'powerup', t, title: 'POWER UP', text: 'BILLING SYSTEM', outT? },                         // pixel bulb arcs in, rings, unlock box
    { type: 'boss', t, title: 'FINAL ROUND', sub: 'BOSS', enemy: { name }, reticleT, reticle: 'TARGET LOCKED',
      weak: { t, text }, chargeT, beam: { t, text }, koT, add?, flash?: true },
    { type: 'win', t, title: 'YOU WIN', lines: ['...', '...'], foot },
    { type: 'continue', t, keyword: 'SYSTEMS', typeT?, placeholder, dm: 'DM SENT', dmT?, from: 9 }  // countdown runs to the last frame
  ]
}
Brand mode (logo battles, render.mjs passes config/brands.json as data.brands). A fighter spec is { brand, name?, tile?, color?, logo?, eyes? }:
  player: { brand: 'openai', color: '#10A37F' }, opponent: { brand: 'claude' }   // opponent = default enemy for rounds without `enemy`
  enemy: { brand: 'amazon', tile: '#232F3E' } on any round/boss also works. tile = logo tile colour, color = HUD bar, gloves, plate, flashes.
  stopMotion: 10 (fps of the cut-paper wobble, default 10 in brand mode, 0 = off), popTop: 640 (popup slot 0 y), handle: '@koredekola'
  prize: { brand: 'replit', owner: 'enemy'|'player', label: 'DEFAULT: CLAUDE' }      // floating trophy logo between the fighters
  crowd: { brands: ['google', 'meta', ...], y: 1550 }                               // front-row logo fans, bobbing at stop-motion fps
  round extras: ko: false (no shatter: stagger + dizzy, enemy stays), koText: 'STOLEN', hp: 0.2 (enemy hp after a soft KO), flash: true | '#hex' | brand id
  new beats (all word-anchored):
    { type: 'title', t, title: 'ROUND 2', sub: '?', outT? }                            // title card only
    { type: 'steal', t, to: 'player'|'enemy', label: 'DEFAULT: OPENAI' }               // prize zips to the new owner in stop motion
    { type: 'counter', t, hitT?, hp: 0.6, text?: 'NO' }                               // current enemy dashes and hits the player
    { type: 'combo', hits: [{ at, text }], hp: 0.25 }                                  // jab per word, HIT xN counter, small label per hit
    { type: 'revive', t, hp: 0.7, text?: 'NOT A K.O.' }                               // soft-KO'd enemy gets back up
    { type: 'rain', t, brands: [...], count: 14, outT? }                               // logos rain down in stepped frames
    { type: 'cheer', t, brands?: [...], text?: 'OOOH' }                                // crowd jumps, optional bubble
    { type: 'throw', t, hitT?, brand | sprite, target: 'player'|'enemy', result: 'block'|'join', text?, from: 'left'|'right'|'top' }
    { type: 'stamp', t, text, brand?|color?, x: 540, y: 800, rot: -6, size: 'sm'?, outT? }
    { type: 'clash', t, hitT?, text? }                                                 // both fighters collide mid-ring, split-colour flash
    { type: 'blast', t, hitT, from?: 'enemy', shots: 7, rocket?: true, hp?: 0.3, hp0?: 1, text?, quiet?: true }   // pixel blaster barrage (+ rocket on hitT); quiet = the round's KO does the boom
  round extras: dash: false (no dash/punch, e.g. when a blast does the damage). palette: 'full' turns off the strict palette, keep: [brand ids] stay in colour, badColor: bad-popup colour
  powerup extras: brand (logo arcs in instead of the bulb), side: 'enemy' (powers the enemy). win extras: brand (winner colours + logo).
window.sfx collects {t, kind, vol} cues: dash punch explode coin powerup bell blip charge beam fanfare beep. */
