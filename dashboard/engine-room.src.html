<title>Engine Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,700&display=swap">
<style>
/* Layout: glass control room on Content Systems ink-green. Left rail nav, top bar, one view at a time (hash routed), detail drawer on the right. Single dark look by choice (brand world). */
:root{
  color-scheme:dark;
  --bg:#0c1510; --bg2:#122019; --glass:rgba(245,240,232,.045); --glass2:rgba(245,240,232,.08);
  --line:rgba(245,240,232,.10); --line2:rgba(245,240,232,.18);
  --fg:#F5F0E8; --muted:#9fae9f; --faint:#6d7c70;
  --gold:#E8B84B; --orange:#C98A3C; --sage:#9CCAA0; --sand:#D8C7A3; --clay:#C98478; --ink:#17281C;
  --ok:#8fd19a; --warn:#E8B84B; --bad:#e5826f;
  --f-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 85% -10%,rgba(232,184,75,.08),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(156,202,160,.07),transparent 60%),var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
/* rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;padding:18px 12px 18px max(12px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:rgba(10,18,13,.6);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand img{width:30px;height:30px}
.brand b{font:700 16px/1.1 var(--f-display);letter-spacing:-.01em;display:block}
.brand small{font:400 10px var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--glass);color:var(--fg)}
.nav a[aria-current=page]{background:var(--glass2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.nav .n{font:400 11px var(--f-mono);color:var(--faint)}
.rail .foot{margin-top:auto;padding:10px 8px;font:400 11px/1.5 var(--f-mono);color:var(--faint)}
.rail .foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:1px}
.rail .foot .dot.live{background:var(--ok);box-shadow:0 0 8px var(--ok)}
/* main */
main{min-width:0;padding-block:22px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font:600 28px/1.1 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin-top:4px}
h2{font:600 15px/1.2 var(--f-display);margin:0;letter-spacing:-.005em}
.lbl{font:400 10.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.pb{padding:0 16px 14px}
.grid{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--glass2);padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.15)}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:12.5px}
.seg button[aria-pressed=true]{background:var(--glass2);color:var(--fg)}
input[type=text],input[type=url],select,textarea{background:rgba(0,0,0,.22);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
.chip{display:inline-flex;align-items:center;gap:6px;font:400 11px var(--f-mono);padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted));display:inline-block}
.st{font:700 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:rgba(245,240,232,.07);color:var(--muted)}
.st.posted{color:var(--ok);background:rgba(143,209,154,.1)}
.st.scheduled{color:var(--sage);background:rgba(156,202,160,.1)}
.st.review{color:var(--gold);background:rgba(232,184,75,.12)}
.st.approved{color:var(--ink);background:var(--gold)}
.st.scripting{color:var(--sand)}
.st.parked{color:var(--faint)}
.empty{padding:26px 16px;color:var(--muted);text-align:center;font-size:13px}
.note{color:var(--muted);font-size:12.5px}
/* today */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.stat{padding:14px 16px}
.stat .v{font:600 30px/1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:8px;letter-spacing:-.02em}
.stat .d{color:var(--faint);font-size:12px;margin-top:4px}
.today{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.ask{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.ask:first-child{border-top:0}
.ask input{width:16px;height:16px;margin-top:2px;accent-color:var(--gold)}
.ask.done .t{color:var(--faint);text-decoration:line-through}
.ask .t{font-weight:500}
.who{font:400 10px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--muted)}
.who.sanjana{color:var(--clay);border-color:rgba(201,132,120,.45)}
.who.korede{color:var(--sage);border-color:rgba(156,202,160,.45)}
.sig{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.sig:first-child{border-top:0}
.sig .h{font-weight:600;line-height:1.35}
.sig .h a{color:inherit;text-decoration:none}
.sig .h a:hover{text-decoration:underline;text-decoration-color:var(--gold)}
.sig .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hot{font:700 10px var(--f-mono);letter-spacing:.08em;color:var(--ink);background:var(--gold);padding:2px 6px;border-radius:5px}
.run{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:rgba(0,0,0,.18);border:1px solid var(--line)}
.run .bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.run .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--orange),var(--gold));animation:slide 2.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.run .bar i{animation:none;width:55%}}
/* calendar */
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:start}
.cal{overflow-x:auto}
.cg{display:grid;grid-template-columns:132px repeat(7,minmax(118px,1fr));min-width:960px}
.cg .hd{padding:10px 8px;border-bottom:1px solid var(--line);font:400 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cg .hd.now{color:var(--gold)}
.cg .hd b{display:block;font:600 18px var(--f-display);color:var(--fg);letter-spacing:0;text-transform:none}
.cg .hd.now b{color:var(--gold)}
.cg .rh{padding:10px 8px 10px 12px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;display:flex;flex-direction:column;justify-content:center}
.cg .rh span{font:400 10.5px var(--f-mono);color:var(--faint);font-weight:400}
.cell{min-height:76px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:4px}
.cell.today{background:rgba(232,184,75,.04)}
.cell.over{background:rgba(232,184,75,.12);box-shadow:inset 0 0 0 1px var(--gold)}
.pc{display:block;width:100%;text-align:left;border:0;cursor:pointer;padding:5px 7px 5px 9px;border-radius:7px;background:rgba(245,240,232,.06);font-size:11.5px;line-height:1.25;position:relative;overflow:hidden}
.pc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.pc:hover{background:rgba(245,240,232,.11)}
.pc .k{display:block;font:400 9.5px var(--f-mono);color:var(--faint);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
.pc.idea{background:transparent;border:1px dashed var(--line2)}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.bank{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}
.bank .list{display:grid;gap:6px;max-height:62vh;overflow:auto;padding-right:2px}
.di{cursor:grab;user-select:none}
.di:active{cursor:grabbing}
/* ideas */
.ideas{grid-template-columns:minmax(0,1fr) 320px;align-items:start}
.ic{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;padding:12px 14px 12px 0;border-top:1px solid var(--line)}
.ic:first-child{border-top:0}
.ic .sw{border-radius:0 4px 4px 0;background:var(--c)}
.ic .t{font-weight:600}
.ic .hk{color:var(--muted);font-size:13px;margin-top:2px}
.ic .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ic .acts{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.form{display:grid;gap:10px}
.form label{display:grid;gap:5px;font-size:12px;color:var(--muted)}
/* production */
.kan{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{min-height:200px}
.col .list{display:grid;gap:8px;padding:0 10px 12px}
.col.over{box-shadow:0 0 0 1px var(--gold)}
.kc{display:block;width:100%;text-align:left;cursor:pointer;border:1px solid var(--line);background:rgba(0,0,0,.18);border-radius:10px;padding:10px 10px 10px 12px;position:relative;overflow:hidden}
.kc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.kc:hover{border-color:var(--line2)}
.kc .t{font-weight:600;font-size:13px}
.kc .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
/* library */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters input{max-width:260px}
.filters select{width:auto}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}
th{font:400 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--bg2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.r{cursor:pointer}
tr.r:hover td{background:rgba(245,240,232,.035)}
td.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12px}
.chk{display:inline-flex;gap:4px}
.chk span{font:700 9.5px var(--f-mono);padding:2px 5px;border-radius:5px;background:rgba(245,240,232,.06);color:var(--faint)}
.chk span.on{background:rgba(143,209,154,.14);color:var(--ok)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);z-index:31;background:#101c15;border-left:1px solid var(--line2);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.db{overflow:auto;padding:16px 20px 24px;display:grid;gap:16px}
.cap{white-space:pre-wrap;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;line-height:1.5;max-height:240px;overflow:auto}
.path{font:400 11.5px var(--f-mono);color:var(--muted);word-break:break-all}
.rev{padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.rev .by{font:400 10.5px var(--f-mono);color:var(--faint);margin-bottom:4px}
.rev.done{opacity:.55}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;z-index:40}
.banner{padding:10px 14px;border-radius:10px;border:1px solid rgba(232,184,75,.35);background:rgba(232,184,75,.07);color:var(--sand);font-size:13px;margin-bottom:14px}
/* responsive */
@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.calwrap{grid-template-columns:minmax(0,1fr)}.bank{position:static}.ideas{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;gap:4px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;z-index:20}
  .brand{padding:0 8px 0 0}.brand div{display:none}
  .nav{display:flex;gap:2px}.nav a{padding:7px 10px;white-space:nowrap}.nav .n{display:none}
  .rail .foot{display:none}
  .today{grid-template-columns:minmax(0,1fr)}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:23px}}
</style>

<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand"><img alt="" src="__MARK__"><div><b>Engine Room</b><small>Content Systems.ai</small></div></div>
    <div class="nav" id="nav">
      <a href="#today">Today <span class="n" id="n-today"></span></a>
      <a href="#calendar">Calendar <span class="n" id="n-cal"></span></a>
      <a href="#ideas">Idea bank <span class="n" id="n-ideas"></span></a>
      <a href="#production">Production <span class="n" id="n-prod"></span></a>
      <a href="#library">Library <span class="n" id="n-lib"></span></a>
    </div>
    <div class="foot"><span class="dot" id="live"></span><span id="synced">Connecting…</span></div>
  </nav>
  <main id="main"></main>
</div>
<div id="layer"></div>

<script>
(() => {
const ROWS = [
  {id:'li-korede', name:'Korede', sub:'LinkedIn'},
  {id:'li-sanjana', name:'Sanjana', sub:'LinkedIn'},
  {id:'li-co', name:'Company', sub:'LinkedIn'},
  {id:'ig-ai', name:'@koredekola.ai', sub:'Instagram'},
  {id:'ig-kk', name:'@koredekola', sub:'Instagram'},
  {id:'ig-co', name:'@contentsystems.ai', sub:'Instagram'},
  {id:'tt-korede', name:'Korede Kola', sub:'TikTok'},
  {id:'tt-co', name:'Content Systems.ai', sub:'TikTok'},
];
const ROW = Object.fromEntries(ROWS.map(r => [r.id, r]));
const LANES = {
  news:{name:'AI news', c:'var(--gold)'},
  whatif:{name:'What-if / game', c:'var(--orange)'},
  carousel:{name:'Carousel', c:'var(--sage)'},
  edit:{name:'Edit / skit', c:'var(--sand)'},
  linkedin:{name:'LinkedIn post', c:'var(--clay)'},
};
const STAGES = [
  {id:'scripting', name:'Scripting'}, {id:'review', name:'Needs review'}, {id:'approved', name:'Approved'},
  {id:'scheduled', name:'Scheduled'}, {id:'posted', name:'Posted'},
];
const ABBR = {'ig-kk':'IG','ig-ai':'.AI','ig-co':'CO','tt-korede':'TT','tt-co':'TT·CO','li-korede':'LI','li-co':'LI·CO','li-sanjana':'LI·S'};

const S = {posts:{}, ideas:{}, signals:{}, asks:{}, revisions:{}, sync:null, ready:false, db:null, user:null, me:null, profiles:{}, canWrite:true,
  week: monday(new Date()), askWho:'all', lib:{q:'', row:'', lane:'', status:''}, open:null, toast:''};

function esc(s){return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmtDay(s){if(!s) return '';const d=new Date(s.length<=16? s : s);return isNaN(d)? s : d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function ago(iso){if(!iso) return 'never';const m=(Date.now()-new Date(iso))/6e4;if(m<1) return 'just now';if(m<60) return Math.round(m)+' min ago';if(m<1440) return Math.round(m/60)+' h ago';return Math.round(m/1440)+' d ago'}
function postDay(p){const s=p.slot||p.nextPost||p.lastPosted;return s? s.slice(0,10):''}
function laneC(l){return (LANES[l]||{c:'var(--muted)'}).c}
function arr(o){return Object.entries(o).map(([id,d])=>({id,...d}))}

/* ---------- render ---------- */
function view(){return (location.hash||'#today').slice(1)}
function render(){
  const v = view();
  document.querySelectorAll('#nav a').forEach(a => a.setAttribute('aria-current', a.getAttribute('href')==='#'+v ? 'page' : 'false'));
  const posts = arr(S.posts), ideas = arr(S.ideas);
  document.getElementById('n-ideas').textContent = ideas.length || '';
  document.getElementById('n-prod').textContent = posts.filter(p=>['scripting','review','approved'].includes(p.status)).length || '';
  document.getElementById('n-lib').textContent = posts.length || '';
  document.getElementById('n-today').textContent = arr(S.asks).filter(a=>!a.done).length || '';
  document.getElementById('synced').textContent = S.sync ? 'Synced '+ago(S.sync.at) : (S.ready ? 'Not synced yet' : 'Connecting…');
  const m = document.getElementById('main');
  m.innerHTML = ({today:vToday, calendar:vCal, ideas:vIdeas, production:vProd, library:vLib}[v] || vToday)();
  wire(v);
  renderLayer();
}

function banner(){
  if(!S.db) return `<div class="banner">The shared board isn't available in this view. Open the artifact on claude.ai while signed in to see live data.</div>`;
  if(S.ready && !Object.keys(S.posts).length) return `<div class="banner">No posts synced yet. Ask Claude to “sync the Engine Room” and the content engine's posts, ideas and research land here.</div>`;
  return '';
}

function vToday(){
  const posts = arr(S.posts), now = Date.now();
  const inProd = posts.filter(p=>['scripting','review','approved'].includes(p.status)).length;
  const sched = posts.filter(p=>p.nextPost && new Date(p.nextPost)-now < 7*864e5 && new Date(p.nextPost)>now).length;
  const posted30 = posts.filter(p=>p.lastPosted && now-new Date(p.lastPosted) < 30*864e5).length;
  const lastAny = posts.map(p=>p.lastPosted).filter(Boolean).sort().pop();
  const asks = arr(S.asks).sort((a,b)=>(a.done-b.done)||(a.order||0)-(b.order||0)).filter(a=>S.askWho==='all'||a.who===S.askWho);
  const open = arr(S.asks).filter(a=>!a.done).length;
  const sigs = arr(S.signals).sort((a,b)=>b.date.localeCompare(a.date)||(b.hot-a.hot)||a.rank-b.rank);
  const latest = sigs[0]?.date; const today = sigs.filter(s=>s.date===latest);
  const running = posts.filter(p=>p.status==='rendering');
  const d = new Date();
  return `${banner()}

function stat(l,v,d){return `<div class="panel stat"><div class="lbl">${esc(l)}</div><div class="v">${esc(v)}</div><div class="d">${esc(d)}</div></div>`}

function vCal(){
  const days = [...Array(7)].map((_,i)=>addDays(S.week,i)), today = ymd(new Date());
  const posts = arr(S.posts), ideas = arr(S.ideas);
  const byCell = {};
  posts.forEach(p=>{const d=postDay(p);if(d) (byCell[p.row+'|'+d] ||= []).push({k:'post',...p})});
  ideas.forEach(i=>{if(i.slot&&i.row) (byCell[i.row+'|'+i.slot] ||= []).push({k:'idea',...i})});
  const end = addDays(S.week,6);
  const bank = ideas.filter(i=>!i.slot);
  const latest = posts.map(postDay).filter(Boolean).sort().pop();
  return `${banner()}
  <div class="top"><div><h1>${esc(S.week.toLocaleDateString(undefined,{month:'short',day:'numeric'}))} to ${esc(end.toLocaleDateString(undefined,{month:'short',day:'numeric'}))}</h1><div class="sub">Drag an idea onto a day to plan it. Colour shows the type of content.</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-wk="-1" aria-label="Previous week">←</button><button class="btn" data-wk="0">This week</button><button class="btn" data-wk="1" aria-label="Next week">→</button>${latest?`<button class="btn ghost" data-jump="${esc(latest)}">Last activity</button>`:''}</div></div>
  <div class="legend" style="margin-bottom:12px">${Object.entries(LANES).map(([k,l])=>`<span class="chip" style="--c:${l.c}"><i></i>${esc(l.name)}</span>`).join('')}<span class="chip" style="border-style:dashed">Idea (planned)</span></div>
  <div class="calwrap">
    <section class="panel cal"><div class="cg">
      <div class="hd"></div>${days.map(d=>`<div class="hd ${ymd(d)===today?'now':''}">${esc(d.toLocaleDateString(undefined,{weekday:'short'}))}<b>${d.getDate()}</b></div>`).join('')}
      ${ROWS.map(r=>`<div class="rh">${esc(r.name)}<span>${esc(r.sub)}</span></div>${days.map(d=>{const key=r.id+'|'+ymd(d);const items=(byCell[key]||[]);return `<div class="cell ${ymd(d)===today?'today':''}" data-drop="${esc(key)}">${items.map(chip).join('')}</div>`}).join('')}`).join('')}
    </div></section>
    <aside class="panel bank"><div class="ph"><h2>Idea bank</h2><span class="lbl">${bank.length}</span></div><div class="pb">
      <div class="list">${bank.length? bank.map(i=>`<button class="pc idea di" draggable="true" data-drag="${esc(i.id)}" data-idea="${esc(i.id)}" style="--c:${laneC(i.lane)}">${esc(i.title)}<span class="k">${esc(ROW[i.row]?.name||'No channel')}</span></button>`).join('') : `<div class="empty">Every idea is on the calendar. Add more in the idea bank.</div>`}</div>
      <div class="note" style="margin-top:10px">On a phone, open an idea and pick a day instead of dragging.</div>
    </div></aside>
  </div>`;
}
function chip(x){
  if(x.k==='idea') return `<button class="pc idea" draggable="true" data-drag="${esc(x.id)}" data-idea="${esc(x.id)}" style="--c:${laneC(x.lane)}">${esc(x.title)}<span class="k">Idea</span></button>`;
  return `<button class="pc" data-post="${esc(x.id)}" style="--c:${laneC(x.lane)}">${esc(x.title)}<span class="k">${esc(x.status)}${x.variants?' · '+x.variants+' variants':''}</span></button>`;
}

function vProd(){

    list.sort((a,b)=>String(b.lastPosted||b.nextPost||b.slot).localeCompare(String(a.lastPosted||a.nextPost||a.slot)));

    return {...s,list,total}});
  return `${banner()}

  <div class="kan">${cols.map(c=>`<section class="panel col" data-stage="${c.id}"><div class="ph"><h2>${esc(c.name)}</h2><span class="lbl">${c.total}</span></div><div class="list">${c.list.length? c.list.map(p=>`<button class="kc" draggable="true" data-drag-post="${esc(p.id)}" data-post="${esc(p.id)}" style="--c:${laneC(p.lane)}"><div class="t">${esc(p.title)}</div><div class="m"><span class="chip">${esc(ROW[p.row]?.name||'')}</span>${p.variants?`<span class="chip">${p.variants} variants</span>`:''}${openRevs(p.id)?`<span class="chip" style="color:var(--gold)">${openRevs(p.id)} notes</span>`:''}</div></button>`).join('') : `<div class="empty">Empty</div>`}${c.id==='posted'&&c.total>12?`<div class="note" style="padding:0 4px">Showing the latest 12. The rest are in the library.</div>`:''}</div></section>`).join('')}</div>`;
}
function openRevs(pid){return arr(S.revisions).filter(r=>r.postId===pid&&!r.done).length}

    <select id="llane" aria-label="Type"><option value="">All types</option>${Object.entries(LANES).map(([k,l])=>`<option value="${k}" ${f.lane===k?'selected':''}>${esc(l.name)}</option>`).join('')}</select>

  <section class="panel tbl"><table><thead><tr><th>Post</th><th>Home</th><th>Type</th><th>Status</th><th>Variants</th><th>Went out on</th><th>Last post</th></tr></thead><tbody>

}

/* ---------- drawer ---------- */
function renderLayer(){
  const L = document.getElementById('layer');
  let h = '';
  if(S.open){
    const {type,id} = S.open;
    if(type==='post' && S.posts[id]) h = postDrawer(id, S.posts[id]);
    else if(type==='idea' && S.ideas[id]) h = ideaDrawer(id, S.ideas[id]);
  }
  if(S.toast) h += `<div class="toast" role="status">${esc(S.toast)}</div>`;
  L.innerHTML = h;
  if(h) wireLayer();
  resolvePeople();
}

/* ---------- wiring ---------- */
function wire(v){
  const m = document.getElementById('main');
  m.querySelectorAll('[data-post]').forEach(el=>{el.addEventListener('click',()=>openD('post',el.dataset.post));el.addEventListener('keydown',e=>{if(e.key==='Enter')openD('post',el.dataset.post)})});
  m.querySelectorAll('[data-idea]').forEach(el=>el.addEventListener('click',()=>openD('idea',el.dataset.idea)));
  m.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>{S.askWho=b.dataset.who;render()});
  m.querySelectorAll('[data-ask]').forEach(c=>c.onchange=()=>write(`asks/${c.dataset.ask}`,{done:c.checked},c.checked?'Marked done':'Reopened'));
  m.querySelectorAll('[data-sig]').forEach(b=>b.onclick=()=>{const s=S.signals[b.dataset.sig];addIdea({title:s.headline.slice(0,120),hook:'',row:'ig-ai',lane:'news',source:'Research '+s.date})});
  m.querySelectorAll('[data-wk]').forEach(b=>b.onclick=()=>{const n=+b.dataset.wk;S.week=n?addDays(S.week,7*n):monday(new Date());render()});
  m.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{S.week=monday(new Date(b.dataset.jump+'T12:00'));render()});
  // drag ideas onto calendar cells
  m.querySelectorAll('[data-drag]').forEach(el=>el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/idea',el.dataset.drag);e.dataTransfer.effectAllowed='move'}));
  m.querySelectorAll('[data-drop]').forEach(c=>{
    c.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('text/idea')){e.preventDefault();c.classList.add('over')}});
    c.addEventListener('dragleave',()=>c.classList.remove('over'));
    c.addEventListener('drop',e=>{e.preventDefault();c.classList.remove('over');const id=e.dataTransfer.getData('text/idea');const [row,day]=c.dataset.drop.split('|');if(id&&S.ideas[id]) write(`ideas/${id}`,{row,slot:day},'Planned for '+fmtDay(day+'T12:00'))});
  });
  // drag posts across production stages
  m.querySelectorAll('[data-drag-post]').forEach(el=>el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/post',el.dataset.dragPost)}));
  m.querySelectorAll('[data-stage]').forEach(c=>{
    c.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('text/post')){e.preventDefault();c.classList.add('over')}});
    c.addEventListener('dragleave',()=>c.classList.remove('over'));
    c.addEventListener('drop',e=>{e.preventDefault();c.classList.remove('over');const id=e.dataTransfer.getData('text/post');if(id&&S.posts[id]&&S.posts[id].status!==c.dataset.stage) write(`posts/${id}`,{status:c.dataset.stage},'Moved to '+c.dataset.stage)});
  });
  const f = document.getElementById('newIdea');
  if(f) f.onsubmit = e=>{e.preventDefault();const t=document.getElementById('ni-title').value.trim();if(!t) return;addIdea({title:t,hook:document.getElementById('ni-hook').value.trim(),row:document.getElementById('ni-row').value,lane:document.getElementById('ni-lane').value,source:''}).then(ok=>{if(ok)f.reset()})};
  const lq=document.getElementById('lq');
  if(lq){let t;lq.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{S.lib.q=lq.value;render();const n=document.getElementById('lq');n.focus();n.setSelectionRange(n.value.length,n.value.length)},220)};
    document.getElementById('lrow').onchange=e=>{S.lib.row=e.target.value;render()};
    document.getElementById('llane').onchange=e=>{S.lib.lane=e.target.value;render()};
    document.getElementById('lst').onchange=e=>{S.lib.status=e.target.value;render()};}
  resolvePeople();
}
function wireLayer(){
  const L=document.getElementById('layer');
  L.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeD);
  if(!S.open) return;
  const {type,id}=S.open;
  if(type==='post'){
    const st=document.getElementById('d-status');
    if(st) st.onchange=()=>write(`posts/${id}`,{status:st.value},'Moved to '+st.value);
    const ap=document.getElementById('d-approve');
    if(ap) ap.onclick=()=>write(`posts/${id}`,{status:'approved',approvedBy:S.me||''},'Approved');
    document.getElementById('d-footage-save').onclick=()=>{const v=document.getElementById('d-footage').value.trim();if(v&&!/^https:\/\//.test(v)){flash('Use a full https:// link');return}write(`posts/${id}`,{footage:v},'Footage link saved')};
    document.getElementById('d-rev').onsubmit=async e=>{e.preventDefault();const ta=document.getElementById('d-rev-t');const t=ta.value.trim();if(!t||!S.db) return;
      try{await S.db.collection('revisions').add({postId:id,text:t,by:S.me||'',at:new Date().toISOString(),done:false});ta.value='';flash('Note added')}catch(err){fail(err)}};
  } else {
    document.getElementById('d-idea').onsubmit=e=>{e.preventDefault();const slot=document.getElementById('di-slot').value.trim();if(slot&&!/^\d{4}-\d{2}-\d{2}$/.test(slot)){flash('Use a date like 2026-12-01');return}
      write(`ideas/${id}`,{title:document.getElementById('di-title').value.trim()||S.ideas[id].title,hook:document.getElementById('di-hook').value.trim(),row:document.getElementById('di-row').value,lane:document.getElementById('di-lane').value,slot},'Idea saved').then(()=>closeD())};
    const del=document.getElementById('di-del');let armed=false;
    del.onclick=async()=>{if(!armed){armed=true;del.textContent='Tap again to delete';setTimeout(()=>{armed=false;if(del.isConnected)del.textContent='Delete idea'},3000);return}
      try{await S.db.doc(`ideas/${id}`).delete();closeD();flash('Idea deleted')}catch(err){fail(err)}};
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.open)closeD()});
function openD(type,id){S.open={type,id};renderLayer();setTimeout(()=>document.querySelector('.drawer button, .drawer select, .drawer input')?.focus(),0)}
function closeD(){S.open=null;renderLayer()}
let tt;function flash(m){S.toast=m;renderLayer();clearTimeout(tt);tt=setTimeout(()=>{S.toast='';renderLayer()},2200)}
function fail(err){const c=err&&err.code;if(c==='invalid_argument'){S.canWrite=false;flash('You can view this board but not change it');render()}else if(c==='quota_exceeded')flash('The board is full. Ask Claude to prune old posts.');else flash('Could not save. Try again in a moment.')}
async function write(path,data,msg){if(!S.db){flash('Open on claude.ai to make changes');return false}
  try{await S.db.doc(path).update(data);flash(msg);return true}catch(err){fail(err);return false}}
async function addIdea(d){if(!S.db){flash('Open on claude.ai to add ideas');return false}
  try{await S.db.collection('ideas').add({...d,slot:'',createdAt:new Date().toISOString(),createdBy:S.me||''});flash('Added to the idea bank');return true}catch(err){fail(err);return false}}

/* people */
let peopleBusy=false;
async function resolvePeople(){
  const els=[...document.querySelectorAll('[data-person]')].filter(e=>e.dataset.person);
  if(!els.length||!S.user||peopleBusy) return;
  peopleBusy=true;
  try{const ids=[...new Set(els.map(e=>e.dataset.person))];const ps=await S.user.profiles(ids);
    document.querySelectorAll('[data-person]').forEach(e=>{const id=e.dataset.person;if(!id) return;const n=(ps[id]&&ps[id].name)||'Someone';e.textContent=e.classList.contains('chip')?'by '+n:n});}catch(_){}
  peopleBusy=false;
}

/* ---------- boot ---------- */
window.addEventListener('hashchange',()=>{S.open=null;render()});
render();
(async()=>{
  const [db,user]=await Promise.all([window.claude?.use?.('db')??null, window.claude?.use?.('user')??null]);
  S.db=db; S.user=user;
  if(user){S.me=await user.id(); const cw=await user.can('data.write'); if(cw===false) S.canWrite=false;}
  if(!db){S.ready=true;render();return}
  const live=document.getElementById('live');
  const timer=setTimeout(()=>{document.getElementById('synced').textContent='Board not reachable yet';},10000);
  let first=0;
  const sub=(coll,key)=>db.collection(coll).onSnapshot(snap=>{
    const o={};snap.docs.forEach(d=>o[d.id]=d.data());S[key]=o;
    if(!snap.metadata.fromCache){clearTimeout(timer);live.classList.add('live');S.ready=true}
    if(++first>=1) render();
  },err=>{clearTimeout(timer);S.ready=true;live.classList.remove('live');render()});
  sub('posts','posts');sub('ideas','ideas');sub('signals','signals');sub('asks','asks');sub('revisions','revisions');
  db.doc('meta/sync').onSnapshot(d=>{S.sync=d.exists?d.data():null;render()},()=>{});
})();
})();
</script>
